<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STUDY HUB — Level 2 · Semester 1</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;800&family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;600&family=JetBrains+Mono:wght@400;600&family=Outfit:wght@400;600&family=Noto+Naskh+Arabic:wght@400;700&family=Cairo:wght@400;700&family=Tajawal:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============ TOKENS ============ */
:root{
  --void:#03040a;
  --s1:#070a14; --s2:#0c1020; --s3:#11162e; --s4:#171d3a;
  --neon-cyan:#00f0ff; --neon-blue:#4d8aff; --neon-purple:#b347d9;
  --neon-pink:#ff4d9e; --neon-green:#00ff9d; --neon-red:#f87171; --neon-gold:#ffd93d;
  --txt:#f0f4ff; --txt2:#8a94b8; --txt3:#4a5578; --txt4:#2a3350;
  --glass:rgba(17,22,46,.45);
  --r-sm:12px; --r-md:20px; --r-lg:28px; --r-xl:40px;
  --acc:#00f0ff; --acc2:#4d8aff; --acc3:#b347d9;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--void); color:var(--txt);
  font-family:'IBM Plex Sans',sans-serif;
  overflow-x:hidden; min-height:100vh;
}
body::before{
  content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
  background-image:
    linear-gradient(rgba(0,240,255,.015) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,240,255,.015) 1px,transparent 1px);
  background-size:56px 56px;
}
::selection{background:rgba(0,240,255,.25)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--s1)}
::-webkit-scrollbar-thumb{background:var(--s4);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#232b52}

/* ============ ORBS + PARTICLES ============ */
.orb{position:fixed;border-radius:50%;filter:blur(110px);z-index:0;pointer-events:none;opacity:.5;animation:orbFloat 20s ease-in-out infinite}
.orb-1{width:520px;height:520px;background:radial-gradient(circle,rgba(77,138,255,.28),transparent 70%);top:-140px;left:-120px}
.orb-2{width:460px;height:460px;background:radial-gradient(circle,rgba(179,71,217,.22),transparent 70%);top:30%;right:-160px;animation-delay:-6s}
.orb-3{width:420px;height:420px;background:radial-gradient(circle,rgba(0,240,255,.18),transparent 70%);bottom:-140px;left:32%;animation-delay:-13s}
@keyframes orbFloat{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(46px,-58px) scale(1.12)}66%{transform:translate(-36px,34px) scale(.94)}}
#particles{position:fixed;inset:0;z-index:0;pointer-events:none}

/* ============ NAV ============ */
nav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:18px 42px;transition:background .35s,border-color .35s,backdrop-filter .35s;
  border-bottom:1px solid transparent;
}
nav.scrolled{background:rgba(3,4,10,.72);backdrop-filter:blur(20px) saturate(160%);border-bottom-color:rgba(255,255,255,.07)}
.logo{display:flex;align-items:center;gap:12px;cursor:pointer}
.logo-icon{
  width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--neon-cyan),var(--neon-blue) 60%,var(--neon-purple));
  font-size:19px;animation:iconPulse 3s ease-in-out infinite;
}
@keyframes iconPulse{0%,100%{box-shadow:0 0 12px rgba(0,240,255,.45)}50%{box-shadow:0 0 30px rgba(0,240,255,.9)}}
.logo b{font-family:'Space Grotesk';font-size:1.05rem;letter-spacing:.14em}
.logo b span{color:var(--neon-cyan)}
.nav-tag{font-family:'IBM Plex Mono';font-size:.62rem;letter-spacing:.22em;color:var(--txt3);border:1px solid var(--txt4);padding:7px 14px;border-radius:99px}

/* ============ VIEWS ============ */
.view{display:none;position:relative;z-index:2}
.view.active{display:block}

/* ============ HERO ============ */
.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:120px 24px 80px;position:relative}
.eyebrow{
  font-family:'IBM Plex Mono';font-size:.66rem;letter-spacing:.32em;color:var(--neon-cyan);
  padding:9px 20px;border:1px solid rgba(0,240,255,.3);border-radius:99px;margin-bottom:34px;
  background:linear-gradient(100deg,transparent 30%,rgba(0,240,255,.14) 50%,transparent 70%);
  background-size:220% 100%;animation:shimmer 3s linear infinite;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.hero h1{
  font-family:'Playfair Display',serif;font-weight:800;
  font-size:clamp(3.2rem,9vw,6.8rem);line-height:1.04;
  background:linear-gradient(115deg,#fff 15%,var(--neon-cyan) 42%,var(--neon-blue) 66%,var(--neon-purple));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:fadeSlideUp .9s ease both;
}
.hero .ar-sub{
  font-family:'Noto Naskh Arabic';direction:rtl;font-size:clamp(1.05rem,2.4vw,1.5rem);
  color:var(--txt2);margin-top:22px;animation:fadeSlideUp .9s .18s ease both;
}
.badges{display:flex;gap:14px;margin-top:34px;animation:fadeSlideUp .9s .32s ease both}
.badge-pill{
  font-family:'IBM Plex Mono';font-size:.68rem;letter-spacing:.24em;padding:11px 22px;border-radius:99px;
}
.badge-pill.purple{color:var(--neon-purple);border:1px solid rgba(179,71,217,.4);background:rgba(179,71,217,.08)}
.badge-pill.cyan{color:var(--neon-cyan);border:1px solid rgba(0,240,255,.35);background:rgba(0,240,255,.06)}
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
.scroll-ind{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;color:var(--txt3);font-family:'IBM Plex Mono';font-size:.58rem;letter-spacing:.3em;animation:fadeSlideUp 1s .6s ease both}
.scroll-ind .line{width:1px;height:52px;background:linear-gradient(var(--neon-cyan),transparent);animation:scrollPulse 2s ease-in-out infinite}
@keyframes scrollPulse{0%,100%{opacity:.35;transform:scaleY(1)}50%{opacity:1;transform:scaleY(1.25)}}

/* ============ SECTION HEADERS ============ */
.section{max-width:1280px;margin:0 auto;padding:60px 34px}
.sec-head{margin-bottom:44px}
.sec-head .kicker{font-family:'IBM Plex Mono';font-size:.64rem;letter-spacing:.3em;color:var(--neon-cyan);margin-bottom:12px}
.sec-head h2{font-family:'Space Grotesk';font-size:clamp(1.6rem,3.4vw,2.4rem);font-weight:700}
.sec-head p{color:var(--txt2);margin-top:8px;font-size:.95rem}

/* ============ SUBJECT CARDS ============ */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:26px}
.card{
  background:var(--glass);backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,.08);border-radius:var(--r-lg);
  padding:30px;cursor:pointer;position:relative;overflow:hidden;
  transition:transform .35s cubic-bezier(.2,.8,.2,1),border-color .35s,box-shadow .35s;
}
.card:hover{transform:translateY(-8px) scale(1.01);border-color:rgba(0,240,255,.25);box-shadow:0 22px 60px -18px rgba(0,240,255,.22)}
.card.disabled{opacity:.55;cursor:not-allowed}
.card.disabled:hover{transform:none;border-color:rgba(255,255,255,.08);box-shadow:none}
.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.dot-tag{display:flex;align-items:center;gap:9px;font-family:'IBM Plex Mono';font-size:.66rem;letter-spacing:.2em;color:var(--txt2)}
.dot-tag .dot{width:9px;height:9px;border-radius:50%;animation:dotPulse 2s ease-in-out infinite}
@keyframes dotPulse{0%,100%{opacity:1;box-shadow:0 0 8px currentColor}50%{opacity:.35;box-shadow:none}}
.status{font-family:'IBM Plex Mono';font-size:.58rem;letter-spacing:.2em;padding:5px 12px;border-radius:99px}
.status.live{color:var(--neon-green);border:1px solid rgba(0,255,157,.35);background:rgba(0,255,157,.07)}
.status.soon{color:var(--txt3);border:1px solid var(--txt4)}
.card-body{display:flex;gap:18px;align-items:flex-start;margin-bottom:24px}
.icon-box{width:64px;height:64px;min-width:64px;border-radius:18px;display:grid;place-items:center;font-size:1.7rem}
.card h3{font-family:'Space Grotesk';font-size:1.28rem;font-weight:700}
.card .ar-name{font-family:'Noto Naskh Arabic';direction:rtl;display:block;text-align:left;color:var(--txt2);font-size:.95rem;margin-top:5px}
.card .desc{color:var(--txt2);font-size:.86rem;margin-top:12px;line-height:1.65}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:24px}
.stat{background:rgba(3,4,10,.5);border:1px solid rgba(255,255,255,.05);border-radius:var(--r-sm);padding:12px 8px;text-align:center}
.stat b{font-family:'Space Grotesk';font-size:1.25rem;display:block}
.stat span{font-family:'IBM Plex Mono';font-size:.55rem;letter-spacing:.16em;color:var(--txt3);text-transform:uppercase}
.cta{
  width:100%;padding:14px;border-radius:14px;border:1px solid rgba(255,255,255,.12);
  background:transparent;color:var(--txt);font-family:'Space Grotesk';font-weight:700;
  font-size:.86rem;letter-spacing:.1em;cursor:pointer;position:relative;overflow:hidden;
  transition:color .3s,border-color .3s;z-index:1;
}
.cta::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .35s;background:var(--cta-grad,linear-gradient(120deg,var(--acc),var(--acc2)))}
.card:hover .cta::before,.cta:hover::before{opacity:1}
.card:hover .cta,.cta:hover{border-color:transparent;color:#03040a}
.cta:disabled{opacity:.5;cursor:not-allowed}
.cta:disabled::before{display:none}
.cta:disabled:hover{color:var(--txt)}

/* ============ SUBJECT VIEW ============ */
.topbar{
  position:sticky;top:0;z-index:90;display:flex;align-items:center;gap:18px;
  padding:16px 30px;background:rgba(3,4,10,.8);backdrop-filter:blur(20px) saturate(160%);
  border-bottom:1px solid rgba(255,255,255,.07);
}
.back-btn{
  display:flex;align-items:center;gap:9px;padding:10px 18px;border-radius:12px;cursor:pointer;
  border:1px solid rgba(255,255,255,.12);background:rgba(17,22,46,.5);color:var(--txt);
  font-family:'IBM Plex Mono';font-size:.68rem;letter-spacing:.18em;transition:border-color .3s,color .3s;
}
.back-btn:hover{border-color:var(--acc);color:var(--acc)}
.topbar h2{font-family:'Space Grotesk';font-size:1.15rem;font-weight:700}
.crumb{margin-left:auto;font-family:'IBM Plex Mono';font-size:.6rem;letter-spacing:.2em;color:var(--txt3);border:1px solid var(--txt4);padding:6px 14px;border-radius:99px}
.subject-wrap{display:flex;width:100%;max-width:none;margin:0;min-height:calc(100vh - 68px)}

/* Sidebar */
.sidebar{
  width:240px;min-width:240px;position:sticky;top:68px;height:calc(100vh - 68px);
  overflow-y:auto;padding:28px 16px;border-right:1px solid rgba(255,255,255,.06);background:rgba(7,10,20,.6);
}
.sidebar .sb-label{font-family:'IBM Plex Mono';font-size:.58rem;letter-spacing:.26em;color:var(--txt3);padding:0 12px 14px}
.ch-item{
  display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:12px;cursor:pointer;
  color:var(--txt2);font-size:.86rem;font-weight:500;margin-bottom:4px;border:1px solid transparent;
  transition:all .25s;font-family:'Outfit';
}
.ch-item .ch-num{font-family:'IBM Plex Mono';font-size:.62rem;width:26px;height:26px;min-width:26px;border-radius:8px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.1);color:var(--ch,var(--txt3))}
.ch-item:hover{background:rgba(255,255,255,.04);color:var(--txt)}
.ch-item.active{background:rgba(255,255,255,.06);color:var(--txt);border-color:var(--acc)}
.ch-item.active .ch-num{border-color:var(--acc);color:var(--acc);box-shadow:0 0 12px rgba(0,240,255,.25)}

/* Content */
.content{flex:1;min-width:0;padding:44px 48px 100px;max-width:980px;margin:0 auto}
/* Hide-sidebar toggle */
.sb-toggle{display:grid;place-items:center;width:40px;height:40px;min-width:40px;border-radius:10px;cursor:pointer;border:none;background:transparent;color:var(--txt2);transition:background .2s,color .2s}
.sb-toggle:hover{background:rgba(255,255,255,.08);color:var(--txt)}
.sb-toggle .sb-fill{opacity:.55;transition:opacity .2s}
.sb-toggle.off .sb-fill{opacity:0}
.subject-wrap.sb-hidden .sidebar{display:none}
.subject-wrap.sb-hidden .content{max-width:none;margin:0}
.chapter{display:none;animation:fadeSlideUp .45s ease both}
.chapter.active{display:block}
.chapter h2{font-family:'Space Grotesk';font-size:clamp(1.5rem,3vw,2.1rem);margin-bottom:6px}
.chapter .ch-kicker{font-family:'IBM Plex Mono';font-size:.62rem;letter-spacing:.26em;color:var(--acc);margin-bottom:14px}
.chapter .ch-desc{color:var(--txt2);font-size:.92rem;margin-bottom:30px;line-height:1.7}
h4.blk-title{font-family:'Space Grotesk';font-size:1.05rem;margin:30px 0 14px;display:flex;align-items:center;gap:10px}
h4.blk-title::before{content:"";width:22px;height:2px;background:var(--acc)}

/* Content blocks */
.block-en{
  background:rgba(0,240,255,.05);border:1px solid rgba(0,240,255,.1);border-radius:10px;
  padding:16px 18px;color:#b3e5fc;direction:ltr;font-size:.92rem;line-height:1.75;margin-bottom:12px;
}
.block-en b,.block-en strong{color:var(--txt)}
.block-ar{
  background:rgba(255,217,61,.06);border-right:3px solid var(--neon-gold);
  border-radius:0 10px 10px 0;padding:16px 18px;color:#fff9c4;direction:rtl;
  font-family:'Tajawal';font-size:.94rem;line-height:1.9;margin-bottom:12px;
}
.code-block{
  background:rgba(0,0,0,.4);border:1px solid rgba(0,240,255,.15);border-radius:8px;
  font-family:'JetBrains Mono',monospace;color:#80cbc4;direction:ltr;
  padding:16px 18px;font-size:.84rem;overflow-x:auto;margin:12px 0;line-height:1.7;
}
.example-box{background:rgba(0,255,157,.05);border:1px solid rgba(0,255,157,.18);border-radius:10px;padding:16px 18px;margin:14px 0}
.example-box .ex-label{font-family:'IBM Plex Mono';font-size:.6rem;letter-spacing:.24em;color:var(--neon-green);display:block;margin-bottom:10px}
.example-box .ex-en{color:#ccf5e5;direction:ltr;font-size:.9rem;line-height:1.7}
.example-box .ex-ar{color:#a5d6a7;direction:rtl;font-family:'Tajawal';font-size:.92rem;line-height:1.9;margin-top:8px}
.bilingual-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.bilingual-row .cell{background:var(--s3);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:16px 18px;font-size:.9rem;line-height:1.75}
.bilingual-row .cell.en{color:#b3e5fc;direction:ltr}
.bilingual-row .cell.ar{color:#fff9c4;direction:rtl;font-family:'Tajawal';border-right:3px solid var(--neon-gold)}
.bilingual-row .cell h5{font-family:'Space Grotesk';font-size:.86rem;margin-bottom:8px;color:var(--txt)}
.bilingual-row .cell.ar h5{font-family:'Noto Naskh Arabic'}
table.data{width:100%;border-collapse:collapse;direction:ltr;margin:16px 0;font-size:.86rem}
table.data th{color:var(--acc);font-family:'IBM Plex Mono';font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;text-align:left;padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.12)}
table.data td{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.05);color:var(--txt2)}
table.data td:first-child{color:var(--txt);font-weight:600}
table.data tr:hover td{background:rgba(0,240,255,.035)}
.recap{
  border:1px solid transparent;border-radius:16px;padding:30px;margin:36px 0 12px;
  background:linear-gradient(var(--s2),var(--s2)) padding-box,
             linear-gradient(120deg,var(--neon-green),var(--neon-cyan)) border-box;
}
.recap h3{font-family:'Space Grotesk';margin-bottom:18px;display:flex;align-items:center;gap:10px}
.recap ul{list-style:none}
.recap li{padding:9px 0 9px 30px;position:relative;color:var(--txt2);font-size:.92rem;line-height:1.7;border-bottom:1px dashed rgba(255,255,255,.06)}
.recap li:last-child{border-bottom:none}
.recap li::before{content:"◆";position:absolute;left:2px;color:var(--neon-cyan);font-size:.7rem;top:13px}
.recap li b{color:var(--txt)}
.collapsible{margin:14px 0}
.collapsible>button{
  width:100%;display:flex;justify-content:space-between;align-items:center;cursor:pointer;
  background:var(--s3);border:1px solid rgba(255,255,255,.08);border-radius:12px;
  padding:15px 18px;color:var(--txt);font-family:'Outfit';font-size:.9rem;font-weight:600;
  transition:border-color .3s;
}
.collapsible>button:hover{border-color:var(--acc)}
.collapsible>button .arrow{transition:transform .3s;color:var(--acc);font-family:'IBM Plex Mono'}
.collapsible.open>button .arrow{transform:rotate(180deg)}
.collapsible .coll-body{display:none;padding:16px 4px 4px;animation:fadeSlideUp .3s ease both}
.collapsible.open .coll-body{display:block}
.fig{display:flex;justify-content:center;margin:20px 0;background:rgba(3,4,10,.45);border:1px solid rgba(255,255,255,.06);border-radius:14px;padding:22px}
.fig figcaption{text-align:center;font-family:'IBM Plex Mono';font-size:.62rem;letter-spacing:.2em;color:var(--txt3);margin-top:12px;width:100%}
.fig svg{max-width:100%}
.mini-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:14px 0}
.mini-card{background:var(--s3);border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:16px;border-top:2px solid var(--acc)}
.mini-card h5{font-family:'Space Grotesk';font-size:.9rem;margin-bottom:8px}
.mini-card p{font-size:.82rem;color:var(--txt2);line-height:1.65}
.mini-card .tag{font-family:'IBM Plex Mono';font-size:.56rem;letter-spacing:.16em;color:var(--acc);display:block;margin-bottom:8px}

/* ============ QUIZ ============ */
.quiz-shell{background:var(--glass);border:1px solid rgba(255,255,255,.08);border-radius:var(--r-lg);padding:34px;backdrop-filter:blur(24px)}
.quiz-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.quiz-top .q-count{font-family:'IBM Plex Mono';font-size:.66rem;letter-spacing:.2em;color:var(--txt2)}
.quiz-top .q-score{font-family:'IBM Plex Mono';font-size:.66rem;letter-spacing:.2em;color:var(--neon-gold)}
.q-progress{height:6px;background:var(--s4);border-radius:99px;overflow:hidden;margin-bottom:30px}
.q-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--neon-blue),var(--neon-cyan));border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.q-card{border:1px solid rgba(255,255,255,.08);border-radius:var(--r-md);padding:28px;margin-bottom:22px;transition:border-color .3s,box-shadow .3s}
.q-card.flash-correct{border-color:rgba(0,255,157,.5);box-shadow:0 0 30px -8px rgba(0,255,157,.35)}
.q-card.flash-wrong{border-color:rgba(248,113,113,.5);box-shadow:0 0 30px -8px rgba(248,113,113,.35)}
.q-num{font-family:'IBM Plex Mono';font-size:.62rem;letter-spacing:.24em;color:var(--neon-cyan);margin-bottom:12px}
.q-text{font-family:'Outfit';font-size:1.06rem;font-weight:600;direction:ltr;margin-bottom:20px;line-height:1.55}
.q-opts{display:grid;gap:10px}
.opt{
  display:flex;align-items:center;gap:14px;text-align:left;cursor:pointer;
  background:rgba(3,4,10,.5);border:1px solid rgba(255,255,255,.1);border-radius:12px;
  padding:14px 16px;color:var(--txt);font-family:'Outfit';font-size:.92rem;transition:all .25s;
}
.opt .letter{font-family:'IBM Plex Mono';font-size:.66rem;width:28px;height:28px;min-width:28px;border-radius:8px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.15);color:var(--txt2)}
.opt:hover:not(:disabled){border-color:var(--neon-cyan);transform:translateX(4px)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--neon-green);background:rgba(0,255,157,.09)}
.opt.correct .letter{border-color:var(--neon-green);color:var(--neon-green)}
.opt.wrong{border-color:var(--neon-red);background:rgba(248,113,113,.09)}
.opt.wrong .letter{border-color:var(--neon-red);color:var(--neon-red)}
.q-explain{
  display:none;direction:rtl;text-align:right;background:rgba(77,138,255,.08);
  border:1px solid rgba(77,138,255,.2);border-radius:12px;padding:16px 18px;margin-top:16px;
  font-family:'Cairo';color:#cfe4ff;font-size:.92rem;line-height:1.9;
}
.q-explain.show{display:block;animation:fadeSlideUp .35s ease both}
.q-explain b{color:var(--neon-gold)}
.quiz-result{display:none;text-align:center;padding:40px 20px}

const LEC01_HTML = `
<div class="lec-page" id="lec01">
  <div class="page-header">
    <span class="page-lec-num">LECTURE 01</span>
    <div class="page-title-wrap"><h2>Introduction to Communication Networks<span>مقدمة في شبكات الاتصالات</span></h2></div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">1 · Data Communications</span><span class="btitle-sep">|</span><span class="btitle-ar">الاتصال بالبيانات</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p>Telecommunication means communication at a distance. Data communications is the exchange of data between two devices via a transmission medium (like a wire cable).</p>
        <p>A data communications system has 5 components:</p>
        <ul>
          <li><strong>Message</strong> — the information itself (text, numbers, pictures, audio, video)</li>
          <li><strong>Sender</strong> — the device that sends the message (computer, workstation, camera)</li>
          <li><strong>Receiver</strong> — the device that receives it (computer, telephone handset)</li>
          <li><strong>Transmission medium</strong> — the physical path (twisted pair, coaxial cable, satellite)</li>
          <li><strong>Protocol</strong> — the set of rules that governs the communication</li>
        </ul>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p>الاتصال عن بعد (Telecommunication) معناه إنك تبعت وتستقبل معلومات وانت بعيد عن الطرف التاني. الاتصال بالبيانات (Data Communications) هو تبادل بيانات بين جهازين عن طريق وسيط نقل زي كابل سلك.</p>
        <p>أي نظام اتصال بيانات مكوّن من 5 عناصر:</p>
        <ul>
          <li><strong>الرسالة (Message)</strong> — المعلومة نفسها، ممكن تكون نص، أرقام، صور، صوت، فيديو</li>
          <li><strong>المُرسِل (Sender)</strong> — الجهاز اللي بيبعت الرسالة، زي كمبيوتر أو كاميرا</li>
          <li><strong>المُستقبِل (Receiver)</strong> — الجهاز اللي بيستقبل، زي كمبيوتر أو تليفون</li>
          <li><strong>وسيط النقل (Transmission medium)</strong> — المسار الفيزيائي اللي البيانات بتعدي عليه، زي كابل نحاس أو قمر صناعي</li>
          <li><strong>البروتوكول (Protocol)</strong> — مجموعة القواعد اللي بتحكم عملية الاتصال، وبتكون موجودة عند المُرسِل والمُستقبِل الاتنين بنفس الشكل</li>
        </ul>
      </div>
    </div>
    <div class="highlight-row">
      <div class="hl-en">Without a shared protocol, sender and receiver can't understand each other — even with a perfect medium.</div>
      <div class="hl-ar">من غير بروتوكول متفق عليه، المُرسِل والمُستقبِل مش هيفهموا بعض حتى لو الوسيط نفسه ممتاز.</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en">You send a WhatsApp voice message to a friend: <strong>Message</strong> = the audio, <strong>Sender</strong> = your phone, <strong>Receiver</strong> = friend's phone, <strong>Medium</strong> = internet (Wi-Fi/4G), <strong>Protocol</strong> = WhatsApp's proprietary protocol that both apps understand.</div>
      <div class="ex-ar">لما بتبعت رسالة صوتية على واتساب: <strong>الرسالة</strong> = الصوت اللي اتسجل، <strong>المُرسِل</strong> = تليفونك، <strong>المُستقبِل</strong> = تليفون صاحبك، <strong>الوسيط</strong> = الإنترنت (Wi-Fi أو 4G)، <strong>البروتوكول</strong> = بروتوكول واتساب اللي التطبيقين الاتنين بيفهموه بنفس الطريقة.</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">2 · Data Flow Modes</span><span class="btitle-sep">|</span><span class="btitle-ar">أنماط تدفق البيانات</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p><strong>Simplex</strong> — communication is one-directional only. Example: keyboard → monitor.</p>
        <p><strong>Half-duplex</strong> — each station can send and receive, but not at the same time. Example: walkie-talkies.</p>
        <p><strong>Full-duplex</strong> — both stations transmit and receive simultaneously. Example: telephone network.</p>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p><strong>Simplex</strong> — الاتصال في اتجاه واحد بس، البيانات بتمشي من جهة لجهة ومش بترجع تاني. زي الكيبورد اللي بيبعت للشاشة، والشاشة معندهاش رد.</p>
        <p><strong>Half-duplex</strong> — كل محطة تقدر تبعت وتستقبل، بس مش في نفس اللحظة — لازم توقف عشان الطرف التاني يتكلم. زي جهاز اللاسلكي (walkie-talkie) لما تضغط للكلام.</p>
        <p><strong>Full-duplex</strong> — الاتنين بيبعتوا ويستقبلوا في نفس الوقت من غير ما يستنوا بعض. زي المكالمة التليفونية العادية اللي انت والشخص التاني بتتكلموا سوا.</p>
      </div>
    </div>
    <div class="highlight-row">
      <div class="hl-en">Think of half-duplex as a one-lane road with traffic lights, and full-duplex as a two-lane highway.</div>
      <div class="hl-ar">تخيل half-duplex زي طريق حارة واحدة فيها إشارة تتحكم مين يعدي، وfull-duplex زي طريق بحارتين كل واحدة ليها اتجاهها.</div>

    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en"><strong>Simplex:</strong> TV broadcast — signal goes from station to your TV, your TV never sends back. <strong>Half-duplex:</strong> Police radio — one officer talks while the other listens, then they swap. <strong>Full-duplex:</strong> Normal phone call — both people speak and hear at the same time.</div>
      <div class="ex-ar"><strong>Simplex:</strong> بث التلفزيون — الإشارة بتيجي من المحطة لشاشتك، وشاشتك مش بتبعت حاجة. <strong>Half-duplex:</strong> راديو الشرطة — ضابط بيتكلم والتاني بيسمع، وبعدين بيتبادلوا. <strong>Full-duplex:</strong> مكالمة تليفون عادية — الاتنين بيتكلموا ويسمعوا في نفس الوقت.</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">3 · Networks & Connection Types</span><span class="btitle-sep">|</span><span class="btitle-ar">الشبكات وأنواع الاتصال</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p>A <strong>network</strong> is a set of devices (nodes) connected by communication links. A node can be a computer, printer, or any device that can send/receive data.</p>
        <p>Two connection types:</p>
        <ul>
          <li><strong>Point-to-point</strong> — a dedicated link between exactly two devices; the entire capacity is reserved for them.</li>
          <li><strong>Multipoint (multidrop)</strong> — more than two devices share a single link, either spatially or by time-sharing.</li>
        </ul>
        <p>Networks are also categorized by geographic coverage: <strong>LAN</strong> (single building/campus), <strong>MAN</strong> (a city), <strong>WAN</strong> (country/continent).</p>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p><strong>الشبكة (Network)</strong> هي مجموعة أجهزة (اسمها nodes) متوصلة ببعض عن طريق روابط اتصال. الـ node ممكن يكون كمبيوتر أو طابعة أو أي جهاز يقدر يبعت أو يستقبل بيانات.</p>
        <p>نوعين اتصال:</p>
        <ul>
          <li><strong>Point-to-point</strong> — رابط مخصص بين جهازين بس، وكل سعة الرابط محجوزة ليهم الاتنين وحدهم.</li>
          <li><strong>Multipoint</strong> — أكتر من جهازين بيشاركوا نفس الرابط، إما بالمكان أو بالتوقيت (كل جهاز ياخد نص).</li>
        </ul>
        <p>الشبكات كمان بتتصنف حسب المساحة اللي بتغطيها: <strong>LAN</strong> (مبنى أو كامبس واحد)، <strong>MAN</strong> (مدينة كاملة)، <strong>WAN</strong> (دولة أو قارة، زي شبكة الإنترنت العالمية).</p>

    <div class="highlight-row">
      <div class="hl-en">LAN → MAN → WAN is essentially a scale of "how far the network reaches", not a different technology.</div>
      <div class="hl-ar">LAN و MAN و WAN هي نفس فكرة الشبكة، بس بتختلف في "المدى" اللي الشبكة بتوصله، مش نوع تكنولوجيا مختلفة تمامًا.</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en"><strong>Point-to-point:</strong> A direct cable between your laptop and a printer — only those two share that link. <strong>Multipoint:</strong> A classroom Wi-Fi router that 30 students connect to simultaneously — all sharing the same medium. <strong>LAN:</strong> Delta University campus network. <strong>MAN:</strong> Mansoura city fiber network. <strong>WAN:</strong> The internet connecting Egypt to the US.</div>
      <div class="ex-ar"><strong>Point-to-point:</strong> كابل مباشر بين لابتوبك والطابعة — الاتنين دول بس بيشاركوا الرابط ده. <strong>Multipoint:</strong> راوتر Wi-Fi في فصل درس 30 طالب كلهم متوصلين بنفس الوسيط. <strong>LAN:</strong> شبكة كامبس جامعة الدلتا. <strong>MAN:</strong> شبكة الألياف الضوئية في مدينة المنصورة. <strong>WAN:</strong> الإنترنت اللي بيوصل مصر بأمريكا.</div>

    <div class="bilingual-grid">

        <p><strong>HUB</strong> (Layer 1 - Physical): broadcasts incoming data to all ports blindly, no filtering, half-duplex only, one collision domain for everyone. Cheap but obsolete today.</p>
        <p><strong>SWITCH</strong> (Layer 2 - Data Link): forwards data only to the correct port using a MAC address table, supports full-duplex, and gives each port its own collision domain. It's the standard device in modern LANs.</p>
        <p><strong>ROUTER</strong> (Layer 3 - Network): routes data between different networks using IP addresses, connects a LAN to a WAN (like the internet), and separates broadcast domains.</p>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p><strong>الهب (HUB)</strong> — بيشتغل على Layer 1، بيستقبل البيانات وبيبعتها لكل البورتات من غير ما يفكر مين المفروض ياخدها. مفيش فلترة، وبيشتغل half-duplex بس، وكل الأجهزة بتشارك نفس الـ collision domain. رخيص لكن دلوقتي بقى قديم ومش بيتستخدم.</p>
        <p><strong>السويتش (SWITCH)</strong> — بيشتغل على Layer 2، وعنده "دفتر عناوين" اسمه MAC address table بيعرف بيه كل جهاز موصول ببورت رقم كام، فبيبعت البيانات للبورت الصح بس مش لكل حد. بيشتغل full-duplex، وكل بورت له collision domain لوحده. هو الجهاز الأساسي في أي شبكة حديثة.</p>
        <p><strong>الراوتر (ROUTER)</strong> — بيشتغل على Layer 3، وبيوجّه البيانات بين شبكات مختلفة تمامًا (زي إنه يوصل شبكة البيت بالإنترنت) باستخدام عنوان الـ IP مش الـ MAC، وبيفصل الـ broadcast domains عن بعض.</p>
      </div>
    </div>
    <div class="highlight-row">
      <div class="hl-en">The 3 devices map directly to the first 3 OSI layers: HUB = Physical, SWITCH = Data Link, ROUTER = Network.</div>
      <div class="hl-ar">الأجهزة التلاتة دي بتتوازى بالظبط مع أول 3 طبقات في OSI: الهب = Physical، السويتش = Data Link، الراوتر = Network.</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en">Imagine 4 PCs (A, B, C, D) all plugged into a <strong>HUB</strong>. PC-A sends data to PC-C → the hub blasts it to B, C, and D all at once; B and D receive junk they must discard. Now replace with a <strong>SWITCH</strong> → it sends only to PC-C's port. Add a <strong>ROUTER</strong> between that LAN and the internet → it forwards traffic using IP addresses across networks.</div>
      <div class="ex-ar">تخيل 4 أجهزة (A, B, C, D) كلها موصلة بـ<strong>HUB</strong>. لما A يبعت لـ C → الهب يبعتها لـ B وC وD كلهم مع بعض، وB وD يستقبلوا بيانات مش ليهم ويتجاهلوها. دلوقتي استبدل بـ<strong>SWITCH</strong> → بيبعت فقط للبورت بتاع C. ضيف <strong>ROUTER</strong> بين الشبكة دي والإنترنت → بيمشي البيانات بين شبكتين مختلفتين باستخدام IP.</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">5 · Network Topologies</span><span class="btitle-sep">|</span><span class="btitle-ar">توبولوجيا الشبكات</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p><strong>Star</strong> — all devices connect to a central switch. Easy to manage, one device failing doesn't affect others, but the whole network dies if the central switch fails. Most common LAN design.</p>
        <p><strong>Bus</strong> — all devices share one backbone cable. Cheap and simple, but if the cable breaks the whole network goes down, and it's slow with many devices.</p>
        <p><strong>Ring</strong> — each device connects to exactly two neighbors forming a closed loop; data travels in one direction. Equal access for all, but one broken link can disrupt the whole ring.</p>
        <p><strong>Mesh</strong> — every device connects to many/all others. Extremely fault-tolerant and redundant, but expensive and complex to wire.</p>
        <p><strong>Hybrid</strong> — combines two or more topologies (e.g. star backbone + several bus segments) to fit large, real-world enterprise networks.</p>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p><strong>النجمة (Star)</strong> — كل الأجهزة متوصلة بسويتش مركزي في النص. سهلة الإدارة، ولو جهاز واحد عطل الباقي مش بيتأثر، بس لو السويتش المركزي نفسه عطل الشبكة كلها بتقع. هي التصميم الأكتر انتشارًا في أي مكتب أو مدرسة.</p>
        <p><strong>الناقل (Bus)</strong> — كل الأجهزة مشتركة في كابل واحد رئيسي (Backbone). رخيصة وبسيطة، بس لو الكابل اتقطع الشبكة كلها بتقع، وبتبقى بطيئة لما عدد الأجهزة يزيد.</p>
        <p><strong>الحلقة (Ring)</strong> — كل جهاز متوصل بجهازين بس جنبه، وبيتكون شكل حلقة مقفولة، والبيانات بتدور في اتجاه واحد. كل الأجهزة عندها نفس فرصة الإرسال، بس لو وصلة واحدة اتقطعت الحلقة كلها بتتعطل.</p>
        <p><strong>الشبكية (Mesh)</strong> — كل جهاز متوصل بأكتر من جهاز أو بكل الأجهزة التانية. أعلى درجة أمان وموثوقية لأن فيه مسارات بديلة كتير، بس غالية جدًا ومعقدة في التوصيل.</p>
        <p><strong>الهجينة (Hybrid)</strong> — بتجمع بين اتنين أو أكتر من التوبولوجيز دي مع بعض (زي نجمة في النص وشبكة Bus فروع منها) عشان تناسب شبكات الشركات الكبيرة الحقيقية.</p>
      </div>
    </div>
    <div class="highlight-row">
      <div class="hl-en">More redundancy (Mesh) always trades off against more cost and complexity — there's no free lunch in topology design.</div>
      <div class="hl-ar">كل ما زادت الموثوقية (زي Mesh) كل ما زادت التكلفة والتعقيد — مفيش تصميم مثالي من غير تنازلات.</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en"><strong>Star:</strong> Your home Wi-Fi — all phones, laptops, and TVs connect to the router (center). If the router dies, everyone loses connection. <strong>Bus:</strong> Old cable TV networks where one main cable served the whole street. <strong>Ring:</strong> Some older industrial control networks. <strong>Mesh:</strong> The internet's backbone routers — multiple paths exist so if one cable is cut, traffic reroutes automatically. <strong>Hybrid:</strong> Delta University — star topology inside each building, connected to a WAN backbone between campuses.</div>
      <div class="ex-ar"><strong>Star:</strong> Wi-Fi البيت — كل التليفونات واللابتوبات بتتوصل بالراوتر (المركز). لو الراوتر عطل، الكل اتقطع. <strong>Bus:</strong> شبكات الكابل القديمة اللي كابل واحد كان بيخدم الشارع كله. <strong>Ring:</strong> بعض شبكات التحكم الصناعي القديمة. <strong>Mesh:</strong> راوترات backbone الإنترنت العالمي — فيه مسارات بديلة كتير، لو كابل اتقطع البيانات بتلاقي طريق تاني أوتوماتيك. <strong>Hybrid:</strong> جامعة الدلتا — Star جوه كل مبنى، وكلها متوصلة ببعض عبر WAN backbone.</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">6 · Firewalls</span><span class="btitle-sep">|</span><span class="btitle-ar">جدران الحماية</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p>A <strong>firewall</strong> sits between a trusted network and an untrusted one (like the internet) and decides what traffic is allowed in or out.</p>
        <p><strong>Packet filtering firewall</strong> — checks only the packet's header (sender IP, receiver IP, port number) against an access control list. Simple, cheap, but low security since it never inspects the actual payload.</p>
        <p><strong>Stateful inspection firewall</strong> — keeps a "conversation list" of active connections, so it can tell if incoming traffic is a real reply to something the user requested. More secure than simple packet filtering.</p>
        <p><strong>Proxy firewall</strong> — acts as a middleman: the user's request goes to the proxy first, and the proxy forwards it to the internet on the user's behalf, hiding the internal network.</p>
        <p><strong>WAF (Web Application Firewall)</strong> — works at the application layer, filtering HTTP/HTTPS traffic specifically to protect web servers.</p>
        <p><strong>NGFW (Next-Generation Firewall)</strong> — adds URL/web filtering, Deep Packet Inspection (DPI) that reads the actual payload, and an Intrusion Prevention System (IPS).</p>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p><strong>الفايروول (Firewall)</strong> بيتحط بين الشبكة الموثوقة (زي شبكة الشركة) وشبكة مش موثوقة (زي الإنترنت)، وبيقرر أي بيانات تدخل أو تخرج.</p>
        <p><strong>Packet filtering firewall</strong> — بيبص بس على "الهيدر" بتاع الباكت (IP المرسِل، IP المستقبِل، رقم البورت) ويقارنه بقايمة صلاحيات (Access Control List). بسيط ورخيص، لكن أمانه ضعيف لأنه أبدًا مش بيفحص المحتوى الفعلي (Payload) جوه الباكت.</p>
        <p><strong>Stateful inspection firewall</strong> — بيحتفظ بـ"قايمة محادثات" لكل الاتصالات الشغالة، فبيقدر يميز إن البيانات الجاية فعلًا رد على طلب المستخدم نفسه ولا لأ. ده بيخليه أأمن من الـ packet filtering العادي.</p>
        <p><strong>Proxy firewall</strong> — بيشتغل زي وسيط: طلب المستخدم بيروح للـ proxy الأول، والـ proxy هو اللي بيبعته للإنترنت بالنيابة عنه، وده بيخفي الشبكة الداخلية عن أي حد بره.</p>
        <p><strong>WAF (Web Application Firewall)</strong> — بيشتغل على طبقة التطبيقات، وبيراقب حركة HTTP/HTTPS تحديدًا عشان يحمي سيرفرات المواقع من الهجمات.</p>
        <p><strong>NGFW (Next-Generation Firewall)</strong> — بيضيف فلترة للمواقع (URL filtering)، وفحص عميق لمحتوى الباكت نفسه (DPI)، ونظام لمنع التسلل (IPS) اللي بيكتشف ويوقف الهجمات قبل ما توصل.</p>
      </div>
    </div>
    <div class="highlight-row">
      <div class="hl-en">Each firewall generation inspects one layer deeper than the last: header → connection state → application content.</div>
      <div class="hl-ar">كل جيل فايروول بيبص لطبقة أعمق من اللي قبله: الهيدر بس → حالة الاتصال → محتوى التطبيق نفسه.</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en"><strong>Packet filtering:</strong> Rule says "block all traffic from IP 192.168.1.5 on port 80" — it checks the header only, doesn't care what data is inside. <strong>Stateful:</strong> You open youtube.com → firewall logs the outgoing request. When YouTube's response arrives, the firewall checks "did we ask for this?" and allows it. A random unsolicited packet gets dropped. <strong>Proxy:</strong> Used in schools to hide student PCs — all requests appear to come from one proxy IP. <strong>WAF:</strong> Protects a bank's website from SQL injection attacks in HTTP requests. <strong>NGFW:</strong> Detects malware hiding inside a PDF attached to an email, even though the email itself arrived on allowed port 25.</div>
      <div class="ex-ar"><strong>Packet filtering:</strong> قاعدة بتقول "امنع أي حاجة من IP 192.168.1.5 على بورت 80" — بيبص على الهيدر بس، مش مهمه إيه جوه الباكت. <strong>Stateful:</strong> فتحت youtube.com → الفايروول سجّل الطلب. لما رد يوتيوب وصل، بيسأل "احنا طلبنا ده؟" ويسمح بيه. باكت جاية من غير ما طلبناها بتتحذف. <strong>Proxy:</strong> بيتستخدم في المدارس عشان يخفي أجهزة الطلاب — كل الطلبات بتظهر وكأنها جاية من IP الـ proxy واحد بس. <strong>WAF:</strong> بيحمي موقع بنك من هجمات SQL injection جوه الـ HTTP requests. <strong>NGFW:</strong> بيكتشف malware مخبي جوه PDF في إيميل، حتى لو الإيميل نفسه وصل على بورت 25 المسموح بيه.</div>
    </div>
  </div>

  <div class="summary-block">
    <h3>ملخص المحاضرة 01 — مقدمة في شبكات الاتصالات</h3>
    <div class="summary-content">
      <p>📡 الاتصال بالبيانات (Data Communications) محتاج 5 عناصر: Message, Sender, Receiver, Medium, Protocol.</p>
      <p>🔁 تدفق البيانات 3 أنواع: Simplex (اتجاه واحد)، Half-duplex (بالدور)، Full-duplex (مع بعض).</p>
      <p>🔗 الاتصال إما Point-to-point (جهازين بس) أو Multipoint (أكتر من جهاز على نفس الرابط).</p>
      <p>🌍 الشبكات بتتصنف حسب المدى: LAN لمبنى، MAN لمدينة، WAN لدولة أو أكتر.</p>
      <p>🖧 HUB (Layer 1) يبعت لكل حد، SWITCH (Layer 2) يبعت للبورت الصح باستخدام MAC، ROUTER (Layer 3) يوصل شبكات مختلفة باستخدام IP.</p>
      <p>🔺 التوبولوجيز: Star (الأشهر)، Bus (رخيصة بس نقطة فشل واحدة)، Ring (متساوية بس هشة)، Mesh (أأمن بس غالية)، Hybrid (خليط لشبكات الشركات).</p>
      <p>🛡️ الفايروولز بتتطور من فحص الهيدر بس (Packet filtering)، لتتبع الاتصال (Stateful)، لإخفاء الشبكة (Proxy)، لحد فحص المحتوى الكامل والحماية من الاختراق (NGFW).</p>
    </div>
  </div>

  {q:"A firewall is typically placed between:",opts:["Two switches in the same LAN","A trusted network and an untrusted network (like the internet)","The keyboard and the monitor","Two hubs"],a:1,ex:"الفايروول بيتحط بين الشبكة الموثوقة (زي شبكة الشركة) وشبكة مش موثوقة (زي الإنترنت) وبيقرر أي بيانات تدخل أو تخرج."},
  {q:"Which firewall acts as a middleman, sending the user's request to the internet on the user's behalf and hiding the internal network?",opts:["Packet filtering firewall","Stateful inspection firewall","WAF","Proxy firewall"],a:3,ex:"الـ Proxy firewall طلب المستخدم بيروح له الأول وهو اللي بيبعته للإنترنت بالنيابة عنه، فبيخفي الشبكة الداخلية عن أي حد بره."},

const CN_LEC02_HTML = `
<div class="lec-page" id="lec02">
  <div class="page-header">
    <span class="page-lec-num">LECTURE 02</span>
    <div class="page-title-wrap"><h2>Network Models — OSI &amp; TCP/IP<span>نماذج الشبكات — OSI و TCP/IP</span></h2></div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">1 · The OSI Model</span><span class="btitle-sep">|</span><span class="btitle-ar">نموذج OSI</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p>The <strong>OSI model</strong> splits network communication into <strong>7 layers</strong>, from top to bottom: <strong>7 Application, 6 Presentation, 5 Session, 4 Transport, 3 Network, 2 Data Link, 1 Physical</strong>.</p>
        <p>Why do we use a layered model?</p>
        <ul>
          <li>It <strong>standardizes network components</strong> so multiple vendors can develop and support them.</li>
          <li>It lets <strong>different types of network hardware and software communicate</strong> with each other.</li>
          <li>It <strong>prevents changes in one layer from affecting the other layers</strong>.</li>
          <li>It divides network communication into <strong>smaller parts</strong>, which makes it easier to learn and understand.</li>

      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p><strong>نموذج OSI</strong> بيقسّم الاتصال في الشبكة لـ <strong>7 طبقات</strong> من فوق لتحت: <strong>7 Application، 6 Presentation، 5 Session، 4 Transport، 3 Network، 2 Data Link، 1 Physical</strong>.</p>
        <p>طب ليه بنستخدم نموذج طبقات؟</p>
        <ul>
          <li>بيعمل <strong>معيار موحّد لمكونات الشبكة</strong> فشركات كتير تقدر تصنّع وتدعم نفس الحاجة.</li>
          <li>بيخلّي <strong>أجهزة وبرامج مختلفة تتفاهم مع بعض</strong> حتى لو من شركات مختلفة.</li>
          <li>بيمنع إن <strong>أي تغيير في طبقة يبوّظ الطبقات التانية</strong>.</li>
          <li>بيقسّم الاتصال لـ<strong>أجزاء صغيرة</strong>، فبيبقى أسهل في التعلّم والفهم.</li>
        </ul>
      </div>
    </div>
    <div class="highlight-row">
      <div class="hl-en">Memory trick (top → bottom): "All People Seem To Need Data Processing" = Application, Presentation, Session, Transport, Network, Data link, Physical.</div>
      <div class="hl-ar">حيلة للحفظ (من فوق لتحت): "All People Seem To Need Data Processing" = Application, Presentation, Session, Transport, Network, Data link, Physical.</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en">A company upgrades its network cables from copper to fiber (Physical layer). The web browser, e-mail app and IP addressing keep working exactly as before — that's layer independence in action.</div>
      <div class="ex-ar">شركة بدّلت كابلات الشبكة من نحاس لألياف ضوئية (طبقة Physical). المتصفح وتطبيق الإيميل وعناوين الـ IP فضلوا شغالين زي ما هما من غير أي تعديل — وده معنى إن كل طبقة مستقلة عن التانية.</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">2 · Layer Interaction &amp; Encapsulation</span><span class="btitle-sep">|</span><span class="btitle-ar">التفاعل بين الطبقات والتغليف</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p>Each layer on Device A talks <strong>logically</strong> to the <strong>same layer</strong> on Device B using a <strong>peer-to-peer protocol</strong> (7th-layer protocol, 6th-layer protocol, and so on). Physically, though, the data goes <strong>down</strong> the layers of A, across the transmission medium, then <strong>up</strong> the layers of B. Neighboring layers talk through <strong>interfaces</strong> (7-6, 6-5, 5-4, 4-3, 3-2, 2-1).</p>
        <p><strong>Intermediate nodes</strong> (routers) only need the <strong>bottom three layers</strong> (Network, Data Link, Physical) to forward data.</p>
        <p><strong>Encapsulation:</strong> as data moves down, each layer adds its own <strong>header</strong> (H7, H6 … H2) in front of the data it received. The Data Link layer also adds a <strong>trailer</strong> (T2). The result is converted to <strong>bits</strong> and sent as signals. The receiver does the reverse — <strong>decapsulation</strong> — each layer removes its own header and passes the rest up.</p>
        <p>Data unit at each layer: <strong>Data</strong> (layers 7, 6, 5) → <strong>Segments</strong> (4) → <strong>Packets</strong> (3) → <strong>Frames</strong> (2) → <strong>Bits</strong> (1).</p>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p>كل طبقة في الجهاز A بتتكلم <strong>منطقيًا</strong> مع <strong>نفس الطبقة</strong> في الجهاز B عن طريق <strong>peer-to-peer protocol</strong> (بروتوكول الطبقة 7، بروتوكول الطبقة 6، وهكذا). لكن <strong>فعليًا</strong> البيانات بتنزل لتحت في طبقات A، وتعدي على وسيط النقل، وبعدين تطلع لفوق في طبقات B. والطبقات المتجاورة بتتكلم مع بعض عن طريق <strong>interfaces</strong> (7-6، 6-5، 5-4، 4-3، 3-2، 2-1).</p>
        <p>الـ<strong>Intermediate nodes</strong> (زي الراوتر) محتاجة بس <strong>أول 3 طبقات من تحت</strong> (Network وData Link وPhysical) عشان تمرّر البيانات.</p>
        <p><strong>التغليف (Encapsulation):</strong> كل ما البيانات تنزل طبقة، الطبقة دي بتضيف <strong>هيدر</strong> خاص بيها (H7، H6 … H2) قدام اللي استلمته. وطبقة Data Link بتضيف كمان <strong>تريلر</strong> (T2) في الآخر. الناتج بيتحوّل لـ<strong>bits</strong> وبيتبعت كإشارات. المستقبِل بيعمل العكس — <strong>فك التغليف (Decapsulation)</strong> — كل طبقة بتشيل الهيدر بتاعها وتسلّم الباقي للي فوقها.</p>
        <p>وحدة البيانات في كل طبقة: <strong>Data</strong> (طبقات 7 و6 و5) ← <strong>Segments</strong> (4) ← <strong>Packets</strong> (3) ← <strong>Frames</strong> (2) ← <strong>Bits</strong> (1).</p>
      </div>
    </div>
    <div class="highlight-row">
      <div class="hl-en">Logical communication is horizontal (same layer ↔ same layer); the real physical flow is vertical (down, across, up).</div>
      <div class="hl-ar">الاتصال المنطقي أفقي (نفس الطبقة مع نفس الطبقة)، لكن المسار الفعلي رأسي (لتحت، وعبر الوسيط، وبعدين لفوق).</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en">Samir types a web request and sends "Hi" to Medhat. <strong>Application</strong> creates the data → <strong>Presentation</strong> formats/encrypts it → <strong>Session</strong> opens the session → <strong>Transport</strong> cuts it into segments (TCP) → <strong>Network</strong> adds IP-receiver and IP-sender (packet) → <strong>Data Link</strong> adds MAC addresses (frame) → <strong>Physical</strong> sends bits as electrical signals over the cable. At Medhat's PC every layer strips its own header on the way up until "Hi" appears on his screen.</div>
      <div class="ex-ar">سمير كتب طلب في المتصفح وبعت "Hi" لمدحت. <strong>Application</strong> بتجهّز الداتا ← <strong>Presentation</strong> بتظبط الشكل وتشفّر ← <strong>Session</strong> بتفتح الجلسة ← <strong>Transport</strong> بتقطّعها segments (بـ TCP) ← <strong>Network</strong> بتضيف IP المستقبِل وIP المُرسِل (باكت) ← <strong>Data Link</strong> بتضيف عناوين MAC (فريم) ← <strong>Physical</strong> بتبعت الـ bits كإشارات كهربية على الكابل. عند مدحت كل طبقة بتشيل الهيدر بتاعها وهي طالعة لحد ما كلمة "Hi" تظهر على شاشته.</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">3 · Network Devices &amp; the Layers</span><span class="btitle-sep">|</span><span class="btitle-ar">قدرات أجهزة الشبكة ومستوى الطبقات</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p>A <strong>host</strong> (your PC) implements the upper layers (Application down to Transport) in software, while the <strong>NIC card</strong> and network devices work in the lower layers.</p>
        <ul>
          <li><strong>Network layer (3):</strong> router.</li>
          <li><strong>Data Link layer (2):</strong> bridge / switch.</li>
          <li><strong>Physical layer (1):</strong> hub / repeater and cabling.</li>
        </ul>
        <p>The higher the layer a device understands, the more "intelligent" its forwarding decision is.</p>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p>الـ<strong>Host</strong> (جهازك) بيشغّل الطبقات العليا (من Application لحد Transport) كـ software، أما كارت الشبكة <strong>NIC</strong> وأجهزة الشبكة فبتشتغل في الطبقات السفلية.</p>
        <ul>
          <li><strong>طبقة Network (3):</strong> الراوتر.</li>
          <li><strong>طبقة Data Link (2):</strong> البريدج / السويتش.</li>
          <li><strong>طبقة Physical (1):</strong> الهب / الريبيتر والكابلات.</li>
        </ul>
        <p>كل ما الجهاز يفهم طبقة أعلى، كل ما قراره في توجيه البيانات يبقى أذكى.</p>

    </div>
    <div class="highlight-row">
      <div class="hl-en">Same idea as Lecture 1: Hub = L1, Switch = L2, Router = L3 — now you know exactly why.</div>
      <div class="hl-ar">نفس فكرة المحاضرة الأولى: الهب = L1، السويتش = L2، الراوتر = L3 — ودلوقتي عرفت السبب بالظبط.</div>
