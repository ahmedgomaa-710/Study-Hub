  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">1 · Why Preprocess the Data?</span><span class="btitle-sep">|</span><span class="btitle-ar">ليه بنعالج الداتا الأول؟</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p>Data mining is only <strong>one step</strong> of the KDD process. Before mining we collect, select, <strong>clean, integrate and transform</strong> the data — these are the pre-processing steps.</p>
        <ul>
          <li><strong>Pre-processing:</strong> data collection → selection → cleaning → integration → transformation</li>
          <li><strong>Then:</strong> data mining → pattern evaluation → knowledge presentation</li>
        </ul>
        <p>Low-quality data leads to <strong>low-quality mining results</strong>. Applying preprocessing enhances the quality of the data, and therefore the quality of the results.</p>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p>الـ Data Mining مجرد <strong>خطوة واحدة</strong> جوه عملية الـ KDD. قبلها لازم نجمع الداتا ونختار منها ونعمل <strong>cleaning و integration و transformation</strong> — دي هي خطوات الـ Pre-processing.</p>
        <ul>
          <li><strong>Pre-processing:</strong> جمع الداتا ← اختيارها ← تنضيفها ← دمجها ← تحويلها</li>
          <li><strong>بعدها:</strong> الـ data mining ← تقييم الأنماط ← عرض المعرفة</li>
        </ul>
        <p>لو دخلت داتا وحشة هتطلع نتايج وحشة. الـ preprocessing بيحسّن جودة الداتا، وبالتالي بيحسّن جودة النتايج.</p>
      </div>
    </div>
    <div class="highlight-row">
      <div class="hl-en">Garbage in, garbage out: low-quality data → data mining → low-quality results.</div>
      <div class="hl-ar">داتا وحشة ← mining ← نتايج وحشة. وعشان كده الـ preprocessing مش اختياري.</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en">A bank mines customer records where some ages are <strong>-5</strong> and many incomes are blank. A model trained on that learns nonsense — cleaning the data first fixes the input, not just the output.</div>
      <div class="ex-ar">بنك بيعمل mining على سجلات عملاء فيها أعمار <strong>-5</strong> ودخل فاضي عند ناس كتير. الموديل هيتعلم حاجات غلط، فالأحسن ننضف الداتا الأول قبل ما نبدأ.</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">2 · Data Quality</span><span class="btitle-sep">|</span><span class="btitle-ar">جودة البيانات</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p>Data quality is a <strong>multidimensional</strong> view with 6 measures:</p>
        <ul>
          <li><strong>Accuracy</strong> — correct or wrong?</li>
          <li><strong>Completeness</strong> — not recorded, unavailable, …</li>
          <li><strong>Consistency</strong> — some modified but some not, dangling references, …</li>
          <li><strong>Timeliness</strong> — is it updated on time?</li>
          <li><strong>Believability</strong> — how much can we trust that it is correct?</li>
          <li><strong>Interpretability</strong> — how easily can it be understood?</li>
        </ul>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p>جودة الداتا بتتقاس من <strong>أكتر من زاوية</strong> — 6 مقاييس:</p>
        <ul>
          <li><strong>Accuracy (الدقة)</strong> — القيمة صح ولا غلط؟</li>
          <li><strong>Completeness (الاكتمال)</strong> — فيه قيم مش متسجلة أو مش متاحة؟</li>
          <li><strong>Consistency (التناسق)</strong> — حاجات اتعدلت وحاجات لأ، أو مراجع معلّقة (dangling)</li>
          <li><strong>Timeliness (التوقيت)</strong> — الداتا بتتحدث في وقتها؟</li>
          <li><strong>Believability (المصداقية)</strong> — قد إيه نثق إنها صح؟</li>
          <li><strong>Interpretability (القابلية للفهم)</strong> — قد إيه سهل نفهمها؟</li>
        </ul>
      </div>
    </div>
    <div class="highlight-row">
      <div class="hl-en">A dataset can fail on one dimension while passing the others — e.g. accurate but incomplete.</div>
      <div class="hl-ar">ممكن الداتا تنجح في مقياس وتفشل في غيره — مثلًا دقيقة بس ناقصة.</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en"><strong>Accuracy:</strong> wrong phone number. <strong>Completeness:</strong> email missing. <strong>Consistency:</strong> one record says "Cairo", another says "القاهرة". <strong>Timeliness:</strong> address last updated in 2015. <strong>Believability:</strong> unknown source. <strong>Interpretability:</strong> codes like "C7" with no legend.</div>
      <div class="ex-ar"><strong>Accuracy:</strong> رقم تليفون غلط. <strong>Completeness:</strong> الإيميل ناقص. <strong>Consistency:</strong> سجل مكتوب فيه "Cairo" وسجل تاني "القاهرة". <strong>Timeliness:</strong> العنوان آخر تحديث له 2015. <strong>Believability:</strong> مصدر مجهول. <strong>Interpretability:</strong> أكواد زي "C7" من غير شرح.</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">3 · Major Tasks in Data Preprocessing</span><span class="btitle-sep">|</span><span class="btitle-ar">المهام الرئيسية في الـ Preprocessing</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <ul>
          <li><strong>Data cleaning</strong> — fill in missing values, smooth noisy data, identify or remove outliers, resolve inconsistencies.</li>
          <li><strong>Data integration</strong> — integrate multiple databases, data cubes, or files.</li>
          <li><strong>Data reduction</strong> — dimensionality reduction, numerosity reduction, data compression.</li>
          <li><strong>Data transformation &amp; discretization</strong> — normalization, concept hierarchy generation.</li>
        </ul>
        <p>Some techniques appear under more than one task (e.g. <strong>binning</strong>, <strong>regression</strong>, <strong>clustering</strong>).</p>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <ul>
          <li><strong>Data cleaning</strong> — نملأ القيم الناقصة، ننعّم الـ noise، نكتشف أو نشيل الـ outliers، ونحل التناقضات.</li>
          <li><strong>Data integration</strong> — ندمج أكتر من database أو data cube أو ملف.</li>
          <li><strong>Data reduction</strong> — تقليل الأبعاد (dimensionality)، تقليل حجم العينات (numerosity)، والضغط (compression).</li>
          <li><strong>Data transformation &amp; discretization</strong> — الـ normalization وبناء الـ concept hierarchy.</li>
        </ul>
        <p>فيه تقنيات بتتكرر في أكتر من مهمة، زي <strong>binning</strong> و<strong>regression</strong> و<strong>clustering</strong>.</p>
      </div>
    </div>
    <div class="highlight-row">
      <div class="hl-en">The four tasks are not strictly sequential — real projects loop between them.</div>
      <div class="hl-ar">المهام الأربعة مش بالضرورة بالترتيب — في المشاريع الحقيقية بترجع بينهم أكتر من مرة.</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en"><strong>Cleaning:</strong> binning, regression, outlier analysis. <strong>Integration:</strong> correlation analysis. <strong>Reduction:</strong> PCA, wavelets, attribute subset selection, sampling, histograms. <strong>Transformation:</strong> normalization, aggregation, concept hierarchy.</div>
      <div class="ex-ar"><strong>Cleaning:</strong> binning وregression وoutlier analysis. <strong>Integration:</strong> correlation analysis. <strong>Reduction:</strong> PCA وwavelets واختيار مجموعة attributes وsampling وhistograms. <strong>Transformation:</strong> normalization وaggregation وconcept hierarchy.</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">4 · Data Cleaning — Dirty Data</span><span class="btitle-sep">|</span><span class="btitle-ar">تنضيف البيانات — الداتا الوحشة</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p>Real-world data is <strong>dirty</strong>: faulty instruments, human or computer errors, and transmission errors produce incorrect data.</p>
        <ul>
          <li><strong>Incomplete</strong> — lacking attribute values or attributes of interest. E.g. Occupation = "" (missing).</li>
          <li><strong>Noisy</strong> — errors or outliers. E.g. Salary = "−10".</li>
          <li><strong>Inconsistent</strong> — discrepancies in codes or names. E.g. Age = "42" but Birthday = "03/07/2010"; rating "1,2,3" became "A,B,C"; duplicates that disagree.</li>
          <li><strong>Intentional</strong> — e.g. disguised missing data: Jan. 1 as everyone's birthday.</li>
        </ul>
        <p>Note: a missing value does <strong>not always</strong> mean an error (e.g. a driver's license number for someone who doesn't drive).</p>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p>داتا العالم الحقيقي <strong>وحشة</strong>: أجهزة بايظة، أخطاء بشرية أو من الكمبيوتر، وأخطاء في النقل — وكلها بتطلّع بيانات غلط.</p>
        <ul>
          <li><strong>Incomplete (ناقصة)</strong> — قيم أو attributes ناقصة. زي Occupation = "" (فاضي).</li>
          <li><strong>Noisy (فيها noise)</strong> — أخطاء أو outliers. زي Salary = "−10".</li>
          <li><strong>Inconsistent (متناقضة)</strong> — تضارب في الأكواد أو الأسماء. زي Age = 42 والـ Birthday = 03/07/2010، أو التقييم كان 1,2,3 وبقى A,B,C، أو سجلات مكررة مش متطابقة.</li>
          <li><strong>Intentional (مقصودة)</strong> — زي الـ disguised missing data: كل الناس تاريخ ميلادهم 1 يناير.</li>
        </ul>
        <p>ملحوظة: القيمة الناقصة <strong>مش دايمًا</strong> غلط (زي رقم رخصة القيادة لواحد مبيسوقش).</p>
      </div>
    </div>
    <div class="highlight-row">
      <div class="hl-en">Three classic problems — incomplete, noisy, inconsistent — plus intentional errors that look like valid data.</div>
      <div class="hl-ar">التلات مشاكل الكلاسيكية: ناقصة، فيها noise، متناقضة — وكمان أخطاء مقصودة شكلها زي الداتا السليمة.</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en">An online form makes "Date of birth" mandatory, so many users just pick the first option: <strong>Jan 1</strong>. The field is filled, but it is really <strong>disguised missing data</strong>.</div>
      <div class="ex-ar">فورم أونلاين بيجبر المستخدم يكتب تاريخ الميلاد، فناس كتير بتختار أول اختيار: <strong>1 يناير</strong>. الخانة مليانة، بس هي في الحقيقة <strong>missing data متخفية</strong>.</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">5 · Handling Missing Data</span><span class="btitle-sep">|</span><span class="btitle-ar">التعامل مع القيم الناقصة</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <ul>
          <li><strong>Ignore the tuple</strong> — usually when the class label is missing (classification). Not effective when the % of missing values per attribute varies a lot.</li>
          <li><strong>Fill in manually</strong> — tedious and often infeasible.</li>
          <li><strong>Fill in automatically with:</strong>
            <ul>
              <li>a <strong>global constant</strong> (e.g. "unknown" — a new class?!)</li>
              <li>the attribute <strong>mean or median</strong> — mean for normal (symmetric) data, median for skewed data</li>
              <li>the mean/median of <strong>samples in the same class</strong> as the tuple</li>
              <li>the <strong>most probable value</strong> — inference-based (regression, Bayesian formula, decision tree). This is the <strong>most popular</strong> method.</li>
            </ul>
          </li>
        </ul>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <ul>
          <li><strong>تجاهل الـ tuple</strong> — بيتعمل عادةً لما الـ class label نفسه ناقص (في الـ classification). مش فعّال لما نسبة النقص بتختلف كتير من attribute للتاني.</li>
          <li><strong>ملء يدوي</strong> — ممل وغالبًا مش عملي.</li>
          <li><strong>ملء أوتوماتيك بـ:</strong>
            <ul>
              <li><strong>قيمة ثابتة</strong> (زي "unknown" — وده بيعمل class جديد!)</li>
              <li><strong>المتوسط (mean) أو الوسيط (median)</strong> — المتوسط للداتا المتماثلة، والوسيط للداتا المنحرفة (skewed)</li>
              <li>متوسط أو وسيط <strong>العينات اللي في نفس الـ class</strong></li>
              <li><strong>القيمة الأرجح</strong> — بالاستنتاج (regression أو Bayesian أو decision tree). وهي <strong>الأشهر</strong>.</li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
    <div class="highlight-row">
      <div class="hl-en">Mean is sensitive to extreme values; median is robust — that is why skewed data should use the median.</div>
      <div class="hl-ar">المتوسط بيتأثر بالقيم المتطرفة، والوسيط لأ — عشان كده الداتا المنحرفة نستخدم لها الوسيط.</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en">Income is missing for a customer aged 25–30. Instead of the global mean, use the <strong>mean/median income of that age group</strong> (same class), which is much closer to reality.</div>
      <div class="ex-ar">دخل عميل عمره بين 25 و30 ناقص. بدل المتوسط العام، نستخدم <strong>متوسط أو وسيط دخل نفس الفئة العمرية</strong> (نفس الـ class) لأنه أقرب للواقع بكتير.</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">6 · Noisy Data & How to Handle It</span><span class="btitle-sep">|</span><span class="btitle-ar">الـ Noise وإزاي نتعامل معاه</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p><strong>Noise</strong> = random error or variance in a measured variable. Causes: faulty data collection instruments, data entry problems, data transmission problems, technology limitations, inconsistent naming conventions.</p>
        <p>Smoothing techniques:</p>
        <ul>
          <li><strong>Binning</strong> — smooth by consulting a value's "neighborhood".</li>
          <li><strong>Regression</strong> — fit the data into regression functions.</li>
          <li><strong>Clustering</strong> — detect and remove outliers.</li>
          <li><strong>Combined computer and human inspection</strong> — detect suspicious values, then a human checks them.</li>
        </ul>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p>الـ <strong>Noise</strong> = خطأ عشوائي أو تشتت في متغير بنقيسه. أسبابه: أجهزة جمع بيانات بايظة، أخطاء إدخال، أخطاء نقل، قيود تكنولوجية، أو تسميات مش موحدة.</p>
        <p>تقنيات التنعيم (Smoothing):</p>
        <ul>
          <li><strong>Binning</strong> — بنعدّل القيمة بالنظر لـ"جيرانها".</li>
          <li><strong>Regression</strong> — بنخلي الداتا تتماشى مع دالة regression.</li>
          <li><strong>Clustering</strong> — بنكتشف الـ outliers ونشيلها.</li>
          <li><strong>فحص مشترك (كمبيوتر + إنسان)</strong> — الكمبيوتر يلاقي القيم المشبوهة والإنسان يراجعها.</li>
        </ul>
      </div>
    </div>
    <div class="highlight-row">
      <div class="hl-en">Other data problems that also need cleaning: duplicate records, incomplete data, inconsistent data.</div>
      <div class="hl-ar">مشاكل تانية محتاجة cleaning برضه: السجلات المكررة، الداتا الناقصة، والداتا المتناقضة.</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en">A temperature sensor usually reads 22–24°C but once reports 85°C. A program flags it as suspicious, and an engineer confirms it was a sensor glitch before it is smoothed or removed.</div>
      <div class="ex-ar">حساس حرارة بيقرأ عادةً 22–24 درجة، ومرة قرأ 85. البرنامج بيعلّم القيمة كمشبوهة، والمهندس بيأكد إنها عطل في الحساس قبل ما تتنعم أو تتشال.</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">7 · Binning</span><span class="btitle-sep">|</span><span class="btitle-ar">الـ Binning (التقسيم لسلال)</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p><strong>Binning</strong> smooths a <strong>sorted</strong> value by consulting its neighborhood. The sorted values are partitioned into a number of "buckets" (bins) — this is <strong>local smoothing</strong>.</p>
        <ul>
          <li><strong>Equal-frequency bins</strong> — each bin has the same number of values.</li>
          <li><strong>Equal-width bins</strong> — the interval range per bin is constant.</li>
          <li><strong>Smoothing by bin means</strong> — each value → the bin mean.</li>
          <li><strong>Smoothing by bin medians</strong> — each value → the bin median.</li>
          <li><strong>Smoothing by bin boundaries</strong> — each value → the closest boundary (the min and max of the bin are the boundaries).</li>
        </ul>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p>الـ <strong>Binning</strong> بينعّم القيمة عن طريق النظر لجيرانها بعد ما <strong>نرتب</strong> الداتا. القيم المرتبة بتتقسم لعدد من "السلال" (bins) — وده <strong>تنعيم محلي (local smoothing)</strong>.</p>
        <ul>
          <li><strong>Equal-frequency</strong> — كل bin فيه نفس عدد القيم.</li>
          <li><strong>Equal-width</strong> — عرض مدى القيم في كل bin ثابت.</li>
          <li><strong>Smoothing by bin means</strong> — كل قيمة تتبدل بمتوسط الـ bin.</li>
          <li><strong>Smoothing by bin medians</strong> — كل قيمة تتبدل بوسيط الـ bin.</li>
          <li><strong>Smoothing by bin boundaries</strong> — كل قيمة تتبدل بأقرب حد (أصغر وأكبر قيمة في الـ bin هما الـ boundaries).</li>
        </ul>
      </div>
    </div>
    <div class="shx-math">Sorted price data: 4, 8, 15, 21, 21, 24, 25, 28, 34

EQUAL-FREQUENCY (3 values per bin)
  Bin 1: 4, 8, 15        Bin 2: 21, 21, 24      Bin 3: 25, 28, 34
  By means:       9, 9, 9          22, 22, 22          29, 29, 29
  By boundaries:  4, 4, 15         21, 21, 24          25, 25, 34

EQUAL-WIDTH (as drawn in the lecture slides)
  Bin 1: 4, 8, 15        Bin 2: 21, 21, 24, 25, 28      Bin 3: 34
  By means:       9, 9, 9          24, 24, 24, 24, 24          34
  By boundaries:  4, 4, 15         21, 21, 21, 28, 28          34</div>
    <div class="highlight-row">
      <div class="hl-en">Strictly, equal-width uses width = (max − min) / N = (34 − 4) / 3 = 10, giving {4, 8}, {15, 21, 21}, {24, 25, 28, 34}. The slide groups values slightly differently, so follow your lecturer's version in the exam.</div>
      <div class="hl-ar">بالقانون الدقيق، الـ equal-width عرضه = (max − min) / N = (34 − 4) / 3 = 10، فالـ bins هتبقى {4, 8} و{15, 21, 21} و{24, 25, 28, 34}. سلايد المحاضرة مقسم بشكل مختلف شوية، فاتبع نسخة الدكتور في الامتحان.</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en">In equal-frequency bin 1 = (4, 8, 15): the mean is (4+8+15)/3 = 9, so all three become <strong>9</strong>. By boundaries, 8 is closer to 4 (distance 4) than to 15 (distance 7), so it becomes <strong>4</strong> → (4, 4, 15).</div>
      <div class="ex-ar">في الـ equal-frequency، الـ bin الأولى = (4, 8, 15): المتوسط = (4+8+15)/3 = 9، فالتلاتة بقوا <strong>9</strong>. وبالـ boundaries: الـ 8 أقرب لـ 4 (مسافة 4) من 15 (مسافة 7)، فبقت <strong>4</strong> → (4, 4, 15).</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">8 · Regression & Clustering for Noise</span><span class="btitle-sep">|</span><span class="btitle-ar">الـ Regression والـ Clustering لمعالجة الـ Noise</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p><strong>Regression</strong> means building or estimating a mathematical model that represents the data, then fitting the existing data to that model (e.g. y = x + 1). Noisy values are replaced by the fitted values on the line.</p>
        <p><strong>Clustering</strong> groups similar points together. All data points that fall <strong>outside the clusters</strong> are outliers — they are mapped into the nearest cluster manually or just deleted.</p>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p>الـ <strong>Regression</strong> معناه نبني أو نقدّر نموذج رياضي بيمثل الداتا (زي y = x + 1)، وبعدين نخلي الداتا تتماشى معاه. القيم اللي فيها noise بتتبدل بقيمها على الخط.</p>
        <p>الـ <strong>Clustering</strong> بيجمّع النقط المتشابهة مع بعض. أي نقطة <strong>بره الـ clusters</strong> تعتبر outlier — يا إما بنوديها لأقرب cluster يدويًا، يا إما بنمسحها.</p>
      </div>
    </div>
    <div class="highlight-row">
      <div class="hl-en">Regression smooths by fitting a function; clustering smooths by finding points that belong to no group.</div>
      <div class="hl-ar">الـ regression بينعّم بإنه يطابق الداتا على دالة، والـ clustering بينعّم بإنه يلاقي النقط اللي مش تابعة لأي مجموعة.</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en">Points lie close to the line y = x + 1 except one far away. With regression, that point is moved onto the line. With clustering, three dense groups form and the far points outside them are flagged as outliers.</div>
      <div class="ex-ar">نقط قريبة من الخط y = x + 1 ما عدا نقطة بعيدة. بالـ regression النقطة دي بتتنقل على الخط. وبالـ clustering بتتكون 3 مجموعات كثيفة، والنقط البعيدة بره المجموعات بتتعلّم كـ outliers.</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">9 · Data Integration</span><span class="btitle-sep">|</span><span class="btitle-ar">دمج البيانات</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p><strong>Data integration</strong> merges data from multiple data stores. It helps reduce and avoid redundancies and inconsistencies in the resulting data set.</p>
        <p>Challenges:</p>
        <ul>
          <li><strong>Semantic heterogeneity</strong> → the <strong>entity identification problem</strong>.</li>
          <li><strong>Structure of data</strong> → functional dependencies and referential constraints.</li>
          <li><strong>Redundancy</strong>.</li>
        </ul>
        <p><strong>Schema integration and object matching:</strong> metadata (name, meaning, data type, allowed range of values, null rules for blank/zero/null) helps avoid errors in schema integration and data transformation.</p>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p>الـ <strong>Data integration</strong> بيدمج داتا جاية من أكتر من مصدر. وبيساعد نقلل ونتجنب الـ redundancy والتناقضات في الداتا النهائية.</p>
        <p>التحديات:</p>
        <ul>
          <li><strong>Semantic heterogeneity</strong> (اختلاف المعنى) ← <strong>مشكلة تحديد الكيان (entity identification problem)</strong>.</li>
          <li><strong>هيكل الداتا</strong> ← الـ functional dependencies والـ referential constraints.</li>
          <li><strong>Redundancy</strong> (التكرار).</li>
        </ul>
        <p><strong>Schema integration و object matching:</strong> الـ metadata (الاسم، المعنى، نوع الداتا، المدى المسموح، وقواعد التعامل مع الفاضي/الصفر/null) بتساعد نتجنب أخطاء الدمج والتحويل.</p>
      </div>
    </div>
    <div class="highlight-row">
      <div class="hl-en">The entity identification problem: how do we know two attributes from different sources refer to the same real-world thing?</div>
      <div class="hl-ar">مشكلة تحديد الكيان: إزاي نعرف إن attributeين من مصدرين مختلفين بيشيروا لنفس الحاجة في الواقع؟</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en">Database A has <strong>cust_id</strong>, database B has <strong>customer_number</strong>. Metadata (meaning, data type, range) shows they are the same attribute, so they merge into one column. One system stores prices in dollars and the other in euros — also fixed during integration.</div>
      <div class="ex-ar">قاعدة بيانات A فيها <strong>cust_id</strong> وقاعدة B فيها <strong>customer_number</strong>. الـ metadata (المعنى، النوع، المدى) بتبين إنهم نفس الـ attribute، فبيندمجوا في عمود واحد. ولو نظام بيخزن الأسعار بالدولار والتاني باليورو، ده كمان بيتظبط وقت الدمج.</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">10 · Redundancy & Correlation (Nominal Data)</span><span class="btitle-sep">|</span><span class="btitle-ar">الـ Redundancy وتحليل الارتباط (البيانات الاسمية)</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p>An attribute is <strong>redundant</strong> if it can be "derived" from another attribute or set of attributes. Redundancy is detected by <strong>correlation analysis</strong> — measuring how strongly one attribute implies the other.</p>
        <ul>
          <li><strong>Nominal data:</strong> χ² (chi-square) test.</li>
          <li><strong>Numeric data:</strong> correlation coefficient and covariance.</li>
        </ul>
        <p><strong>χ² test:</strong> hypothesis = the two attributes are <strong>independent</strong>. The <strong>larger</strong> the χ² value, the more likely the variables are related. The cells contributing most are those whose actual count is very different from the expected count.</p>
        <p><strong>Correlation does not imply causality.</strong></p>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p>الـ attribute بيبقى <strong>redundant</strong> لو نقدر "نشتقه" من attribute تاني أو مجموعة attributes. والـ redundancy بنكتشفها بـ<strong>correlation analysis</strong> — بنقيس قد إيه attribute بيدل على التاني.</p>
        <ul>
          <li><strong>داتا اسمية (nominal):</strong> اختبار χ² (كاي تربيع).</li>
          <li><strong>داتا رقمية:</strong> معامل الارتباط (correlation coefficient) والـ covariance.</li>
        </ul>
        <p><strong>اختبار χ²:</strong> الفرضية = الـ attributeين <strong>مستقلين (independent)</strong>. كل ما قيمة χ² <strong>زادت</strong> كل ما زاد احتمال إن المتغيرين مرتبطين. والخانات اللي بتساهم أكتر هي اللي العدد الفعلي فيها بعيد جدًا عن المتوقع.</p>
        <p><strong>الارتباط مش معناه سببية.</strong></p>
      </div>
    </div>
    <div class="shx-math">chi-square:  χ² = Σ (Observed − Expected)² / Expected
expected:    e(i,j) = count(A = a_i) × count(B = b_j) / n
df = (r − 1) × (c − 1)      (r = rows, c = columns)</div>
    <div class="highlight-row">
      <div class="hl-en">Correlation does not imply causality: hospitals and car thefts in a city are correlated because both depend on a third variable — population.</div>
      <div class="hl-ar">الارتباط مش معناه سببية: عدد المستشفيات وسرقات العربيات في المدينة مرتبطين لأن الاتنين بيعتمدوا على متغير تالت وهو عدد السكان.</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en">An attribute "age" and another "birth year" are redundant — one is derived from the other. Likewise, "annual revenue" is derivable from "monthly revenue", so one of them can be dropped.</div>
      <div class="ex-ar">الـ attribute "age" و"birth year" redundant — واحد مشتق من التاني. وبرضه "annual revenue" ممكن نحسبه من "monthly revenue"، فنقدر نشيل واحد منهم.</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">11 · χ² Worked Example (Gender × Preferred Reading)</span><span class="btitle-sep">|</span><span class="btitle-ar">مثال محلول على χ²</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p>Is <strong>preferred reading</strong> (fiction / non-fiction) independent of <strong>gender</strong>? Observed counts are in the table; the numbers in brackets are the <strong>expected</strong> counts under independence.</p>
        <p>For 1 degree of freedom at the 0.001 significance level, the χ² value needed to reject the hypothesis is <strong>10.828</strong>. Since 507.93 &gt; 10.828, we <strong>reject</strong> independence → the two attributes are <strong>strongly correlated</strong>.</p>
        <p>Degrees of freedom: if r &gt; 1 and c &gt; 1 then df = (r−1)(c−1); r = c = 1 is not allowed.</p>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p>هل <strong>نوع القراءة المفضل</strong> (fiction / non-fiction) <strong>مستقل</strong> عن <strong>الجنس</strong>؟ الأرقام في الجدول هي القيم الفعلية (observed)، والأرقام اللي بين الأقواس هي القيم <strong>المتوقعة (expected)</strong> لو كانوا مستقلين.</p>
        <p>عند درجة حرية 1 ومستوى دلالة 0.001، القيمة اللازمة لرفض الفرضية هي <strong>10.828</strong>. وبما إن 507.93 &gt; 10.828 فـ<strong>بنرفض</strong> فرضية الاستقلال ← يعني الاتنين <strong>مرتبطين بقوة</strong>.</p>
        <p>درجات الحرية: لو r &gt; 1 و c &gt; 1 يبقى df = (r−1)(c−1)، ومينفعش r = c = 1.</p>
      </div>
    </div>
    <div class="shx-tbl-wrap"><table class="shx-tbl">
      <tr><th></th><th>MALE</th><th>FEMALE</th><th>TOTAL</th></tr>
      <tr><td>Fiction</td><td>250 (90)</td><td>200 (360)</td><td>450</td></tr>
      <tr><td>Non-fiction</td><td>50 (210)</td><td>1000 (840)</td><td>1050</td></tr>
      <tr><td>Total</td><td>300</td><td>1200</td><td>1500</td></tr>
    </table></div>
    <div class="shx-math">e11 = 300 × 450 / 1500 = 90      e12 = 1200 × 450 / 1500 = 360
e21 = 300 × 1050 / 1500 = 210    e22 = 1200 × 1050 / 1500 = 840

χ² = (250−90)²/90 + (50−210)²/210 + (200−360)²/360 + (1000−840)²/840
   = 284.44 + 121.90 + 71.11 + 30.48 = 507.93

df = (2−1)(2−1) = 1,  significance 0.001  →  critical value = 10.828
507.93 &gt; 10.828  →  reject independence</div>
    <div class="highlight-row">
      <div class="hl-en">Reject the independence hypothesis when the computed χ² is larger than the critical value for the chosen df and significance level.</div>
      <div class="hl-ar">بنرفض فرضية الاستقلال لما χ² المحسوبة تبقى أكبر من القيمة الحرجة لدرجة الحرية ومستوى الدلالة المختارين.</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en">Expected fiction-male = 300 × 450 / 1500 = 90, but the observed value is 250 — far above. This gap (250−90)² / 90 = 284.44 is the <strong>largest contribution</strong> to χ², showing the male–fiction cell is the main source of the correlation.</div>
      <div class="ex-ar">المتوقع لـ fiction-male = 300 × 450 / 1500 = 90، لكن الفعلي 250 — أعلى بكتير. الفرق ده (250−90)² / 90 = 284.44 هو <strong>أكبر مساهمة</strong> في χ²، يعني خانة male–fiction هي المصدر الرئيسي للارتباط.</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">12 · Correlation & Covariance (Numeric Data)</span><span class="btitle-sep">|</span><span class="btitle-ar">معامل الارتباط والـ Covariance (البيانات الرقمية)</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p><strong>Pearson's correlation coefficient</strong> r(A,B), where n is the number of tuples, Ā and B̄ are the means, σA and σB the standard deviations.</p>
        <ul>
          <li>r &gt; 0 → <strong>positively</strong> correlated (A increases as B increases). The higher, the stronger.</li>
          <li>r = 0 → <strong>independent</strong> (no linear correlation).</li>
          <li>r &lt; 0 → <strong>negatively</strong> correlated.</li>
        </ul>
        <p><strong>Covariance:</strong> positive → A and B change together (if A &gt; Ā then B &gt; B̄); negative → one is above its mean while the other is below; if A and B are independent, Cov(A,B) = 0.</p>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p><strong>معامل ارتباط بيرسون</strong> r(A,B)، حيث n عدد الـ tuples، وĀ وB̄ المتوسطات، وσA وσB الانحرافات المعيارية.</p>
        <ul>
          <li>r &gt; 0 ← ارتباط <strong>موجب</strong> (A بتزيد لما B بتزيد). كل ما زاد الرقم كل ما كان الارتباط أقوى.</li>
          <li>r = 0 ← <strong>مستقلين</strong> (مفيش ارتباط خطي).</li>
          <li>r &lt; 0 ← ارتباط <strong>سالب</strong>.</li>
        </ul>
        <p><strong>الـ Covariance:</strong> موجب ← A وB بيتحركوا مع بعض (لو A &gt; Ā يبقى B &gt; B̄)؛ سالب ← واحد فوق متوسطه والتاني تحت متوسطه؛ ولو A وB مستقلين يبقى Cov(A,B) = 0.</p>
      </div>
    </div>
    <div class="shx-math">r(A,B) = Σ (a_i − Ā)(b_i − B̄) / ((n−1)·σA·σB)  =  (Σ a_i·b_i − n·Ā·B̄) / ((n−1)·σA·σB)

Cov(A,B) = Σ (a_i − Ā)(b_i − B̄) / n  =  E(A·B) − Ā·B̄
r(A,B)   = Cov(A,B) / (σA · σB)

Stocks:   AllElectronics = 6, 5, 4, 3, 2      HighTech = 20, 10, 14, 5, 5
Ā = 20/5 = 4        B̄ = 54/5 = 10.8
Cov = (6·20 + 5·10 + 4·14 + 3·5 + 2·5)/5 − 4 × 10.8 = 50.2 − 43.2 = 7</div>
    <div class="highlight-row">
      <div class="hl-en">Covariance tells the direction of the relationship; dividing by σA·σB gives r, which is scaled between −1 and 1.</div>
      <div class="hl-ar">الـ covariance بيقول اتجاه العلاقة، ولما نقسمه على σA·σB بنطلع بـ r اللي قيمته بين −1 و1.</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en">Cov(AllElectronics, HighTech) = 7 &gt; 0, so the two stock prices tend to <strong>rise together</strong>.</div>
      <div class="ex-ar">الـ Cov(AllElectronics, HighTech) = 7 &gt; 0، يعني سعر السهمين بيميل إنه <strong>يزيد مع بعض</strong>.</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">13 · Data Reduction — Strategies</span><span class="btitle-sep">|</span><span class="btitle-ar">تقليل البيانات — الاستراتيجيات</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <ul>
          <li><strong>Dimensionality reduction</strong> — reduce the number of attributes: wavelet transforms, PCA, attribute subset selection.</li>
          <li><strong>Numerosity reduction</strong> — replace the original data volume by a smaller representation.
            <ul>
              <li><strong>Parametric</strong> — a model estimates the data; only the parameters are stored (e.g. regression).</li>
              <li><strong>Nonparametric</strong> — store reduced representations: histograms, clustering, sampling.</li>
            </ul>
          </li>
          <li><strong>Compression</strong> — transformations that produce a "compressed" representation: <strong>lossless</strong> or <strong>lossy</strong>.</li>
        </ul>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <ul>
          <li><strong>Dimensionality reduction</strong> — تقليل عدد الـ attributes: wavelet transforms وPCA واختيار مجموعة attributes.</li>
          <li><strong>Numerosity reduction</strong> — نستبدل حجم الداتا الأصلي بتمثيل أصغر.
            <ul>
              <li><strong>Parametric</strong> — موديل بيقدّر الداتا ومنخزن الـ parameters بس (زي الـ regression).</li>
              <li><strong>Nonparametric</strong> — منخزن تمثيل مصغّر: histograms وclustering وsampling.</li>
            </ul>
          </li>
          <li><strong>Compression</strong> — تحويلات بتطلّع نسخة "مضغوطة": <strong>lossless</strong> (من غير فقد) أو <strong>lossy</strong> (بفقد).</li>
        </ul>
      </div>
    </div>
    <div class="highlight-row">
      <div class="hl-en">Dimensionality reduction shrinks columns; numerosity reduction shrinks rows (the data volume); compression shrinks the representation.</div>
      <div class="hl-ar">الـ dimensionality بيصغّر الأعمدة، والـ numerosity بيصغّر حجم الداتا (الصفوف)، والـ compression بيصغّر طريقة التمثيل.</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en">A table with 1 million rows and 50 columns: PCA may keep 10 columns (dimensionality), sampling may keep 50,000 rows (numerosity), and zip-style compression stores the file smaller (compression).</div>
      <div class="ex-ar">جدول فيه مليون صف و50 عمود: الـ PCA ممكن يخلي 10 أعمدة (dimensionality)، والـ sampling ممكن يخلي 50,000 صف (numerosity)، والضغط بيخزن الملف بحجم أصغر (compression).</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">14 · Attribute Subset Selection</span><span class="btitle-sep">|</span><span class="btitle-ar">اختيار مجموعة الـ Attributes</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p>Goal: find a <strong>minimum set of attributes</strong> such that the resulting probability distribution of the data is as close as possible to the original distribution using all attributes. An exhaustive search can be prohibitively expensive, so <strong>heuristic (greedy)</strong> search is used:</p>
        <ul>
          <li><strong>Stepwise forward selection</strong> — start with an empty set; at each iteration add the best remaining attribute.</li>
          <li><strong>Stepwise backward elimination</strong> — start with all attributes; at each step remove the worst one.</li>
          <li><strong>Combination</strong> of forward selection and backward elimination.</li>
          <li><strong>Decision tree induction</strong>.</li>
        </ul>
        <p><strong>Attribute construction</strong> — build new attributes from existing ones (e.g. area from height and width).</p>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p>الهدف: نلاقي <strong>أقل مجموعة attributes</strong> بحيث التوزيع الاحتمالي للداتا يكون أقرب ما يمكن للتوزيع الأصلي بكل الـ attributes. البحث الشامل (exhaustive) غالي جدًا، فبنستخدم بحث <strong>heuristic (greedy)</strong>:</p>
        <ul>
          <li><strong>Stepwise forward selection</strong> — نبدأ بمجموعة فاضية، وفي كل خطوة نضيف أحسن attribute باقي.</li>
          <li><strong>Stepwise backward elimination</strong> — نبدأ بكل الـ attributes، وفي كل خطوة نشيل أسوأ واحد.</li>
          <li><strong>مزيج</strong> من forward وbackward.</li>
          <li><strong>Decision tree induction</strong>.</li>
        </ul>
        <p><strong>Attribute construction</strong> — نبني attributes جديدة من الموجودة (زي المساحة من الطول والعرض).</p>
      </div>
    </div>
    <div class="highlight-row">
      <div class="hl-en">Forward selection grows the set from nothing; backward elimination shrinks it from everything.</div>
      <div class="hl-ar">الـ forward بيكبّر المجموعة من الصفر، والـ backward بيصغّرها من الكل.</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en">Predicting house price from 20 attributes: forward selection first adds "area" (best), then "location", and stops when new attributes stop helping. Attribute construction can add <strong>area = height × width</strong>.</div>
      <div class="ex-ar">توقع سعر شقة من 20 attribute: الـ forward بيضيف "المساحة" الأول (الأفضل)، بعدين "الموقع"، ويقف لما الإضافات الجديدة متفيدش. والـ attribute construction ممكن يضيف <strong>area = height × width</strong>.</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">15 · Numerosity Reduction — Regression & Histograms</span><span class="btitle-sep">|</span><span class="btitle-ar">تقليل الحجم — Regression و Histograms</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p><strong>Regression (parametric):</strong> data is modeled to fit a straight line. A response variable y is modeled as a linear function of a predictor x: <strong>y = wx + b</strong>. w and b are the regression coefficients (slope and y-intercept), solved by the <strong>method of least squares</strong> — minimizing the error between the actual data and the best-fitting line. Only w and b are stored.</p>
        <p><strong>Histograms (nonparametric):</strong> partition the distribution of an attribute into disjoint <strong>buckets/bins</strong>. Singleton buckets hold a single value/frequency pair; buckets often represent continuous ranges.</p>
        <ul>
          <li><strong>Equal-width</strong> — each bucket has a uniform range (e.g. $10).</li>
          <li><strong>Equal-frequency (equal-depth)</strong> — each bucket holds roughly the same number of samples.</li>
        </ul>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p><strong>Regression (parametric):</strong> بنخلي الداتا تتماشى مع خط مستقيم. المتغير y (response) بيتمثل كدالة خطية في x (predictor): <strong>y = wx + b</strong>. الـ w وb هما معاملات الـ regression (الميل ونقطة التقاطع مع y)، وبنحلهم بـ<strong>طريقة المربعات الصغرى (least squares)</strong> — أي بنقلل الخطأ بين الداتا الفعلية وأحسن خط. وبنخزن w وb بس.</p>
        <p><strong>Histograms (nonparametric):</strong> بنقسم توزيع الـ attribute لـ<strong>سلال (buckets/bins)</strong> منفصلة. الـ singleton bucket فيه قيمة واحدة وتكرارها، والـ buckets غالبًا بتمثل مدى متصل.</p>
        <ul>
          <li><strong>Equal-width</strong> — كل bucket ليه نفس المدى (مثلًا 10$).</li>
          <li><strong>Equal-frequency (equal-depth)</strong> — كل bucket فيه تقريبًا نفس عدد العينات.</li>
        </ul>
      </div>
    </div>
    <div class="shx-math">Regression:  y = w·x + b     (w = slope, b = y-intercept; solved by least squares)

Data:  X = 1, 2, 3, 4, 5      Y = 1.00, 2.00, 1.30, 3.75, 2.25
Fit :  y = 0.425·x + 0.785      →  predict at x = 4:  0.425×4 + 0.785 = 2.485

Histogram of AllElectronics prices (52 items), 3 equal-width buckets:
  $1–10 → 13 items      $11–20 → 25 items      $21–30 → 14 items</div>
    <div class="highlight-row">
      <div class="hl-en">Regression stores two numbers (w, b) instead of all the points; a histogram stores bucket counts instead of all the values.</div>
      <div class="hl-ar">الـ regression بيخزن رقمين (w وb) بدل كل النقط، والـ histogram بيخزن عدد كل bucket بدل كل القيم.</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en">Instead of storing 52 price values, store three counts: 13 items in $1–10, 25 items in $11–20, 14 items in $21–30. For X–Y data, store only <strong>w = 0.425</strong> and <strong>b = 0.785</strong>.</div>
      <div class="ex-ar">بدل ما نخزن 52 سعر، نخزن 3 أعداد بس: 13 سلعة في 1–10$، و25 في 11–20$، و14 في 21–30$. وفي بيانات X–Y نخزن بس <strong>w = 0.425</strong> و<strong>b = 0.785</strong>.</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">16 · Sampling</span><span class="btitle-sep">|</span><span class="btitle-ar">أخذ العينات (Sampling)</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p>Represent a large dataset by a smaller <strong>random sample</strong>:</p>
        <ul>
          <li><strong>SRSWOR</strong> — simple random sample <em>without</em> replacement of size s: draw s of the N tuples (s &lt; N); all tuples are equally likely.</li>
          <li><strong>SRSWR</strong> — simple random sample <em>with</em> replacement: each drawn tuple is recorded and <strong>placed back</strong>, so it may be drawn again.</li>
          <li><strong>Cluster sample</strong> — if tuples are grouped into M clusters, take an SRS of s clusters.</li>
          <li><strong>Stratified sample</strong> — tuples are divided into strata; take an SRS at <strong>each stratum</strong> (e.g. a stratum per customer age group).</li>
        </ul>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p>بنمثل الداتا الكبيرة بـ<strong>عينة عشوائية</strong> أصغر:</p>
        <ul>
          <li><strong>SRSWOR</strong> — عينة عشوائية بسيطة <em>من غير إرجاع</em> بحجم s: بنسحب s من N tuple (s &lt; N)، وكل tuple احتمال سحبه متساوي.</li>
          <li><strong>SRSWR</strong> — عينة عشوائية بسيطة <em>بإرجاع</em>: كل tuple بيتسحب بيتسجل وبعدين <strong>بيرجع تاني</strong>، فممكن يتسحب مرة تانية.</li>
          <li><strong>Cluster sample</strong> — لو الـ tuples متقسمة لـ M clusters، نسحب s clusters بشكل عشوائي.</li>
          <li><strong>Stratified sample</strong> — الـ tuples متقسمة لطبقات (strata)، ونسحب عينة عشوائية من <strong>كل طبقة</strong> (مثلًا طبقة لكل فئة عمرية).</li>
        </ul>
      </div>
    </div>
    <div class="highlight-row">
      <div class="hl-en">Stratified sampling guarantees every group is represented; a plain random sample might miss small groups.</div>
      <div class="hl-ar">الـ stratified بيضمن إن كل مجموعة ممثلة، لكن العينة العشوائية العادية ممكن تفوّت المجموعات الصغيرة.</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en">A bank has 90% adults and 10% seniors. A <strong>stratified</strong> sample takes a random 1,000 from each age group, so seniors are never missed. With <strong>SRSWR</strong>, the same customer could be picked twice.</div>
      <div class="ex-ar">بنك فيه 90% بالغين و10% كبار سن. الـ <strong>stratified</strong> بيسحب 1,000 عشوائي من كل فئة عمرية، فكبار السن مبيتفوتوش. أما في <strong>SRSWR</strong> ممكن نفس العميل يتسحب مرتين.</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">17 · Data Transformation</span><span class="btitle-sep">|</span><span class="btitle-ar">تحويل البيانات</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p>The data are <strong>transformed</strong> into forms appropriate for analysis or mining. Methods:</p>
        <ul>
          <li><strong>Smoothing</strong> — remove noise from data.</li>
          <li><strong>Aggregation</strong> — summarization (e.g. daily sales → monthly or annual sales).</li>
          <li><strong>Generalization</strong> — replace data by higher-level concepts using concept hierarchies (e.g. city → country).</li>
          <li><strong>Normalization</strong> — scale attribute data to fall within a small specified range (e.g. 0.0–1.0 or −1.0–1.0).</li>
          <li><strong>Attribute construction</strong> — build new attributes from the given ones.</li>
        </ul>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p>الداتا بتتحول لشكل مناسب للتحليل أو الـ mining. الطرق:</p>
        <ul>
          <li><strong>Smoothing</strong> — شيل الـ noise من الداتا.</li>
          <li><strong>Aggregation</strong> — تلخيص (زي المبيعات اليومية ← شهرية أو سنوية).</li>
          <li><strong>Generalization</strong> — نستبدل الداتا بمفاهيم أعلى باستخدام concept hierarchies (زي المدينة ← الدولة).</li>
          <li><strong>Normalization</strong> — نحوّل قيم الـ attribute لمدى صغير محدد (زي 0.0–1.0 أو −1.0–1.0).</li>
          <li><strong>Attribute construction</strong> — نبني attributes جديدة من الموجودة.</li>
        </ul>
      </div>
    </div>
    <div class="highlight-row">
      <div class="hl-en">Aggregation summarizes along a dimension (time); generalization climbs a concept hierarchy (place, category).</div>
      <div class="hl-ar">الـ aggregation بيلخص على بُعد (زي الزمن)، والـ generalization بيطلع في concept hierarchy (زي المكان أو الفئة).</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en"><strong>Aggregation:</strong> 30 daily sales rows become 1 monthly total. <strong>Generalization:</strong> "Alexandria" and "Cairo" are replaced by "Egypt". <strong>Normalization:</strong> salaries from 5,000–50,000 are rescaled to 0–1.</div>
      <div class="ex-ar"><strong>Aggregation:</strong> 30 صف مبيعات يومية بيبقوا إجمالي شهري واحد. <strong>Generalization:</strong> "الإسكندرية" و"القاهرة" بيتبدلوا بـ"مصر". <strong>Normalization:</strong> مرتبات من 5,000 لـ 50,000 بتتحول لمدى 0–1.</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">18 · Normalization — Z-Score & RobustScaler</span><span class="btitle-sep">|</span><span class="btitle-ar">الـ Normalization — Z-Score و RobustScaler</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p><strong>Z-score (StandardScaler)</strong> — also known as <strong>zero-mean normalization</strong>. It makes each feature have <strong>mean 0</strong> and <strong>standard deviation 1</strong>, bringing all features to the same magnitude. However, it does <strong>not</strong> guarantee any particular minimum or maximum values.</p>
        <p><strong>RobustScaler</strong> — works like the StandardScaler (puts features on the same scale) but uses the <strong>median and quartiles</strong> instead of the mean and variance. This makes it <strong>ignore outliers</strong> (e.g. measurement errors), which can cause trouble for other scaling techniques.</p>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p><strong>Z-score (StandardScaler)</strong> — اسمه كمان <strong>zero-mean normalization</strong>. بيخلي كل feature متوسطها <strong>0</strong> وانحرافها المعياري <strong>1</strong>، فكل الـ features توصل لنفس الحجم. لكن <strong>مبيضمنش</strong> قيمة أصغر أو أكبر معينة.</p>
        <p><strong>RobustScaler</strong> — شغال زي الـ StandardScaler (بيحط الـ features على نفس المقياس) بس بيستخدم <strong>الوسيط والـ quartiles</strong> بدل المتوسط والتباين. وده بيخليه <strong>يتجاهل الـ outliers</strong> (زي أخطاء القياس) اللي ممكن تبوّظ طرق scaling تانية.</p>
      </div>
    </div>
    <div class="shx-math">z = (x − μ) / σ        μ = mean = Σx_i / N        σ = sqrt( Σ(x_i − μ)² / N )

Example: μ = $54,000, σ = $16,000  →  x = $73,600
z = (73600 − 54000) / 16000 = 1.225</div>
    <div class="highlight-row">
      <div class="hl-en">Use z-score for roughly clean data; use RobustScaler when outliers could distort the mean and standard deviation.</div>
      <div class="hl-ar">استخدم z-score للداتا النضيفة تقريبًا، واستخدم RobustScaler لما الـ outliers ممكن تبوّظ المتوسط والانحراف المعياري.</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en">Income has μ = 54,000 and σ = 16,000. A customer earning 73,600 gets z = <strong>1.225</strong> — about 1.2 standard deviations above the average. One billionaire in the data would drag the mean up, so RobustScaler would be safer there.</div>
      <div class="ex-ar">الدخل متوسطه 54,000 وانحرافه 16,000. عميل دخله 73,600 يبقى z = <strong>1.225</strong> — يعني فوق المتوسط بحوالي 1.2 انحراف معياري. ولو فيه ملياردير واحد في الداتا هيشد المتوسط لفوق، فهنا الـ RobustScaler أأمن.</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">19 · Normalization — Min-Max & Decimal Scaling</span><span class="btitle-sep">|</span><span class="btitle-ar">الـ Normalization — Min-Max و Decimal Scaling</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p><strong>Min-Max (MinMaxScaler)</strong> — a <strong>linear transformation</strong> of the original data based on the maximum and minimum values of the attribute and the new range. It shifts the data so that all features are exactly between <strong>0 and 1</strong> (by default).</p>
        <p><strong>Decimal scaling</strong> — normalizes by <strong>moving the decimal point</strong> of the values of attribute A: x' = x / 10<sup>k</sup>. The number of places moved depends on the maximum absolute value of A; k is the smallest integer such that Max(|x'|) &lt; 1.</p>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p><strong>Min-Max (MinMaxScaler)</strong> — <strong>تحويل خطي</strong> للداتا الأصلية بناءً على أكبر وأصغر قيمة في الـ attribute والمدى الجديد. بيحرك الداتا بحيث كل الـ features تبقى بالظبط بين <strong>0 و1</strong> (افتراضيًا).</p>

z = (73600 − 12000) / (98000 − 12000) × (1 − 0) + 0 = 0.716

Decimal scaling:  x' = x / 10^k      k = smallest integer such that max(|x'|) &lt; 1</div>
