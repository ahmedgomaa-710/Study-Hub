    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en">A router receives a frame, strips the Layer-2 header to read the IP address (Layer 3), picks the next hop, then wraps the packet in a new frame. A hub never reads anything — it only repeats electrical signals.</div>
      <div class="ex-ar">الراوتر بيستلم فريم، يشيل هيدر Layer 2 عشان يقرأ عنوان الـ IP (Layer 3)، يختار الـ hop الجاي، وبعدين يغلّف الباكت في فريم جديد. أما الهب فمابيقرأش أي حاجة — بيكرر الإشارات الكهربية بس.</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">4 · Layer 7 — Application</span><span class="btitle-sep">|</span><span class="btitle-ar">طبقة التطبيقات</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p>The Application layer is the <strong>software on our PCs</strong> that gives the user an <strong>interface to the network</strong>, so the user can run network applications.</p>
        <p>Each application relies on a protocol that supports its action:</p>
        <ul>
          <li><strong>HTTP / HTTPS</strong> — web browsers</li>
          <li><strong>FTP</strong> — file transfer / downloading</li>
          <li><strong>SMTP, POP3</strong> — e-mail</li>
        </ul>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p>طبقة Application هي <strong>البرامج اللي على جهازنا</strong> اللي بتدّي المستخدم <strong>واجهة للتعامل مع الشبكة</strong>، فيقدر يشغّل تطبيقات الشبكة.</p>
        <p>كل تطبيق بيعتمد على بروتوكول بيدعم شغله:</p>
        <ul>
          <li><strong>HTTP / HTTPS</strong> — المتصفحات</li>
          <li><strong>FTP</strong> — نقل وتحميل الملفات</li>
          <li><strong>SMTP وPOP3</strong> — الإيميل</li>
        </ul>
      </div>
    </div>
    <div class="highlight-row">
      <div class="hl-en">The Application layer is NOT the app itself (e.g. Chrome) — it's the protocol that app uses to talk to the network.</div>
      <div class="hl-ar">طبقة Application مش هي التطبيق نفسه (زي Chrome) — هي البروتوكول اللي التطبيق بيستخدمه عشان يتكلم مع الشبكة.</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en"><strong>HTTPS:</strong> you open a website in Chrome or Firefox. <strong>FTP:</strong> you download a file from a server. <strong>SMTP:</strong> you press "Send" on a Gmail message.</div>
      <div class="ex-ar"><strong>HTTPS:</strong> بتفتح موقع من Chrome أو Firefox. <strong>FTP:</strong> بتنزّل ملف من سيرفر. <strong>SMTP:</strong> بتدوس "Send" على رسالة Gmail.</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">5 · Layer 6 — Presentation</span><span class="btitle-sep">|</span><span class="btitle-ar">طبقة العرض</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p>The Presentation layer is responsible for <strong>presenting the data in the proper format</strong>. It does three jobs:</p>
        <ul>
          <li><strong>Translation</strong> — converting data (like "ABC 123") into the binary system / agreed format so both sides understand it.</li>
          <li><strong>Encryption / Decryption</strong> — scrambling data for security and unscrambling it at the receiver (e.g. <strong>SSL — Secure Sockets Layer</strong>).</li>
          <li><strong>Compression</strong> — shrinking data so it transfers faster.</li>
        </ul>
        <p>Format examples: <strong>ASCII, AVI, JPG</strong>.</p>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p>طبقة Presentation مسؤولة عن <strong>عرض البيانات بالشكل الصحيح</strong>. وليها 3 وظايف:</p>
        <ul>
          <li><strong>الترجمة (Translation)</strong> — تحويل البيانات (زي "ABC 123") لنظام ثنائي / صيغة متفق عليها عشان الطرفين يفهموها.</li>
          <li><strong>التشفير وفك التشفير (Encryption / Decryption)</strong> — تخبّي البيانات للأمان وتفكّها عند المستقبِل (زي <strong>SSL — Secure Sockets Layer</strong>).</li>
          <li><strong>الضغط (Compression)</strong> — تصغّر حجم البيانات عشان تتنقل أسرع.</li>
        </ul>
        <p>أمثلة على الصيغ: <strong>ASCII وAVI وJPG</strong>.</p>
      </div>
    </div>
    <div class="highlight-row">
      <div class="hl-en">Three words to remember for Layer 6: Translate, Encrypt, Compress.</div>
      <div class="hl-ar">3 كلمات تفتكرهم لطبقة 6: Translate وEncrypt وCompress.</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en">You log in to a banking site: the password is <strong>encrypted</strong> with SSL before leaving your PC, the page's images are <strong>compressed</strong> as JPG, and the text is encoded as <strong>ASCII</strong> so the server reads it correctly. At the receiver it is decrypted and shown as "****".</div>
      <div class="ex-ar">بتسجّل دخول على موقع بنك: الباسورد بيتشفّر بـ SSL قبل ما يسيب جهازك، والصور بتتضغط بصيغة JPG، والنص بيتكوّد بـ ASCII عشان السيرفر يقراه صح. وعند المستقبِل بيتفك تشفيره.</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">6 · Layer 5 — Session</span><span class="btitle-sep">|</span><span class="btitle-ar">طبقة الجلسة</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p>The Session layer <strong>makes sure all the information required to open a session is available</strong>, and gives the orders for the <strong>establishment, management, and termination</strong> of the session.</p>
        <p>What it deals with:</p>
        <ul>
          <li><strong>Transmission mode</strong> — simplex, half-duplex or full-duplex.</li>
          <li><strong>Authentication</strong> — who are you? (login).</li>
          <li><strong>Authorization</strong> — what are you allowed to do?</li>
          <li><strong>Session management</strong> — keeping the session alive and closing it properly.</li>
        </ul>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p>طبقة Session <strong>بتتأكد إن كل المعلومات اللازمة لفتح الجلسة متوفرة</strong>، وبتدّي الأوامر <strong>لإنشاء الجلسة وإدارتها وإنهائها</strong>.</p>
        <p>بتتعامل مع:</p>
        <ul>
          <li><strong>نمط الإرسال</strong> — simplex أو half-duplex أو full-duplex.</li>
          <li><strong>التحقق من الهوية (Authentication)</strong> — إنت مين؟ (تسجيل الدخول).</li>
          <li><strong>الصلاحيات (Authorization)</strong> — مسموحلك تعمل إيه؟</li>
          <li><strong>إدارة الجلسة</strong> — تفضل الجلسة شغالة وتتقفل بشكل سليم.</li>
        </ul>
      </div>
    </div>
    <div class="highlight-row">
      <div class="hl-en">Authentication = "who are you?", Authorization = "what can you do?" — don't mix them up.</div>
      <div class="hl-ar">Authentication = "إنت مين؟"، Authorization = "تقدر تعمل إيه؟" — متخلطهمش.</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en">You log in to Facebook (<strong>authentication</strong>), it shows you only your own account and not others' (<strong>authorization</strong>), keeps you logged in while you browse (<strong>session management</strong>), and ends the session when you press "Log out" or lose the connection.</div>
      <div class="ex-ar">بتسجّل دخول على فيسبوك (<strong>Authentication</strong>)، وبيوريك حسابك إنت بس مش حسابات غيرك (<strong>Authorization</strong>)، وبيفضّلك داخل وانت بتتصفح (<strong>Session management</strong>)، وبينهي الجلسة لما تدوس "Log out" أو الاتصال يقطع.</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">7 · Layer 4 — Transport</span><span class="btitle-sep">|</span><span class="btitle-ar">طبقة النقل</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p>The Transport layer is responsible for the <strong>actual mechanism</strong> of:</p>
        <ol>
          <li><strong>Establishment</strong> of the connection.</li>
          <li><strong>Management</strong> of the connection: <strong>segmentation</strong>, <strong>sequencing</strong>, <strong>end-to-end check</strong>, <strong>error detection &amp; correction</strong>, and <strong>flow control</strong>.</li>
          <li><strong>Termination</strong> of the connection.</li>
        </ol>
        <p><strong>Segmentation:</strong> data is cut into segments, each labeled with a <strong>port number</strong> and a <strong>sequence number</strong>, then re-assembled (desegmentation) in the right order at the receiver.</p>
        <p><strong>Flow control:</strong> matching the sending rate to the receiver's ability.</p>
        <p>Two protocols:</p>
        <ul>
          <li><strong>TCP</strong> (Transmission Control Protocol) — <strong>connection-oriented</strong>, reliable.</li>
          <li><strong>UDP</strong> (User Datagram Protocol) — <strong>connectionless</strong>, unreliable but fast.</li>
        </ul>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p>طبقة Transport مسؤولة عن <strong>الآلية الفعلية</strong> لـ:</p>
        <ol>
          <li><strong>إنشاء</strong> الاتصال.</li>
          <li><strong>إدارة</strong> الاتصال: <strong>التقطيع (segmentation)</strong>، <strong>الترتيب (sequencing)</strong>، <strong>الفحص من طرف لطرف</strong>، <strong>اكتشاف وتصحيح الأخطاء</strong>، و<strong>التحكم في التدفق (flow control)</strong>.</li>
          <li><strong>إنهاء</strong> الاتصال.</li>
        </ol>
        <p><strong>التقطيع:</strong> البيانات بتتقطّع segments، كل segment عليه <strong>رقم بورت</strong> و<strong>رقم تسلسل</strong>، وعند المستقبِل بتتجمّع تاني (desegmentation) بالترتيب الصح.</p>
        <p><strong>Flow control:</strong> إنك تظبط سرعة الإرسال على قد قدرة المستقبِل.</p>
        <p>بروتوكولين:</p>
        <ul>
          <li><strong>TCP</strong> (Transmission Control Protocol) — <strong>connection-oriented</strong> وموثوق.</li>
          <li><strong>UDP</strong> (User Datagram Protocol) — <strong>connectionless</strong> مش مضمون بس سريع.</li>
        </ul>
      </div>
    </div>
    <div class="highlight-row">
      <div class="hl-en">TCP = reliable but heavier (sender and receiver exchange segments and acknowledgements); UDP = fire and forget, lighter and faster.</div>
      <div class="hl-ar">TCP = موثوق بس أتقل (المرسِل والمستقبِل بيتبادلوا segments وإقرارات)؛ UDP = ابعت وانسى، أخف وأسرع.</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en"><strong>Flow control:</strong> a PC with a 100 Mbps link sends to a phone that can only take 10 Mbps → transport slows the sender to 10 Mbps so the phone isn't overwhelmed. <strong>TCP:</strong> downloading a file or loading a bank page (every byte must arrive). <strong>UDP:</strong> a live video call or online game (speed matters more than a lost packet).</div>
      <div class="ex-ar"><strong>Flow control:</strong> جهاز سرعة وصلته 100 Mbps بيبعت لموبايل ميقدرش ياخد غير 10 Mbps ← الـ Transport بيبطّئ المرسِل لـ 10 Mbps عشان الموبايل ميتغرقش. <strong>TCP:</strong> تحميل ملف أو صفحة بنك (كل بايت لازم يوصل). <strong>UDP:</strong> مكالمة فيديو لايف أو لعبة أونلاين (السرعة أهم من باكت ضايعة).</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">8 · Layer 3 — Network</span><span class="btitle-sep">|</span><span class="btitle-ar">طبقة الشبكة</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p>The Network layer is responsible for:</p>
        <ol>
          <li><strong>End-to-end delivery</strong> — from the source host to the destination host, possibly across many networks.</li>
          <li><strong>Logical addressing</strong> — IPv4, IPv6. The layer adds the <strong>sender IP</strong> and <strong>receiver IP</strong> to the segment, creating a <strong>packet</strong>.</li>
          <li><strong>Routing</strong> — choosing the <strong>best path</strong> to the destination, using routing protocols such as <strong>RIP</strong> (Routing Information Protocol) and <strong>OSPF</strong> (Open Shortest Path First).</li>
        </ol>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p>طبقة Network مسؤولة عن:</p>
        <ol>
          <li><strong>التوصيل من طرف لطرف (End-to-end delivery)</strong> — من جهاز المصدر لجهاز الوجهة، حتى لو عدّى على شبكات كتير.</li>
          <li><strong>العنونة المنطقية (Logical addressing)</strong> — IPv4 وIPv6. الطبقة بتضيف <strong>IP المرسِل</strong> و<strong>IP المستقبِل</strong> على الـ segment فيتكوّن <strong>packet</strong>.</li>
          <li><strong>التوجيه (Routing)</strong> — اختيار <strong>أفضل مسار</strong> للوجهة، بالاستعانة ببروتوكولات توجيه زي <strong>RIP</strong> (Routing Information Protocol) و<strong>OSPF</strong> (Open Shortest Path First).</li>
        </ol>
      </div>
    </div>
    <div class="highlight-row">
      <div class="hl-en">Packet = IP receiver + IP sender + data segment. The IP addresses never change on the way (end-to-end).</div>
      <div class="hl-ar">Packet = IP المستقبِل + IP المرسِل + الـ data segment. عناوين الـ IP مابتتغيّرش في الطريق (end-to-end).</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en">Your laptop in Network 1 sends data to a server in Network 2. The router compares possible roads and picks the "best road" (shortest / least costly) using a routing protocol. If one path is down, it picks another.</div>
      <div class="ex-ar">اللابتوب بتاعك في Network 1 بيبعت داتا لسيرفر في Network 2. الراوتر بيقارن الطرق الممكنة ويختار "أفضل طريق" (الأقصر أو الأقل تكلفة) باستخدام بروتوكول توجيه. ولو مسار وقع بيختار مسار تاني.</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">9 · Layer 2 — Data Link</span><span class="btitle-sep">|</span><span class="btitle-ar">طبقة ربط البيانات</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p>The Data Link layer is responsible for <strong>hop-to-hop</strong> communication:</p>
        <ol>
          <li><strong>Hop-to-hop data delivery</strong> (framing the packet).</li>
          <li><strong>Hop-to-hop addressing</strong> — the <strong>MAC address</strong> in Ethernet.</li>
          <li><strong>Hop-to-hop error detection.</strong></li>
          <li><strong>Hop-to-hop flow control.</strong></li>
        </ol>
        <p>It adds <strong>MAC-receiver</strong> and <strong>MAC-sender</strong> in a header and a <strong>trailer</strong> around the IP packet, forming a <strong>frame</strong>. It also controls <strong>access to the media</strong> (Media Access Control) for the upper layers.</p>
        <p><strong>MAC address:</strong> the <strong>physical address</strong> burned into the <strong>NIC</strong> (Network Interface Card) — <strong>48 bits</strong> written as <strong>12 hexadecimal digits</strong> (each digit = 4 bits), e.g. <strong>00-B0-D0-63-C2-26</strong>.</p>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p>طبقة Data Link مسؤولة عن الاتصال <strong>خطوة بخطوة (hop-to-hop)</strong>:</p>
        <ol>
          <li><strong>توصيل البيانات من hop لـ hop</strong> (تغليف الباكت في فريم).</li>
          <li><strong>العنونة من hop لـ hop</strong> — الـ <strong>MAC address</strong> في الـ Ethernet.</li>
          <li><strong>اكتشاف الأخطاء</strong> على مستوى كل hop.</li>
          <li><strong>التحكم في التدفق</strong> على مستوى كل hop.</li>
        </ol>
        <p>بتضيف <strong>MAC المستقبِل</strong> و<strong>MAC المرسِل</strong> في هيدر، و<strong>تريلر</strong> حوالين الـ IP packet، فيتكوّن <strong>frame</strong>. وكمان بتتحكم في <strong>الوصول للوسيط (Media Access Control)</strong> للطبقات اللي فوقها.</p>
        <p><strong>الـ MAC address:</strong> هو <strong>العنوان الفيزيائي</strong> المطبوع على كارت الشبكة <strong>NIC</strong> — طوله <strong>48 bit</strong> بيتكتب كـ<strong>12 رقم hexadecimal</strong> (كل رقم = 4 bits)، مثال: <strong>00-B0-D0-63-C2-26</strong>.</p>
      </div>
    </div>
    <div class="highlight-row">
      <div class="hl-en">IP address = "where in the world" (end-to-end). MAC address = "which exact card on this local link" (hop-to-hop).</div>
      <div class="hl-ar">عنوان IP = "فين في العالم" (end-to-end). عنوان MAC = "أنهي كارت بالظبط على الوصلة المحلية دي" (hop-to-hop).</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en">A PC sends "Hello" to a laptop through routers R1 and R2. On the cable from the PC to R1 the IP packet travels inside an <strong>Ethernet frame</strong> (H1/T1). Between R2 and the laptop it is wrapped in a <strong>wireless frame</strong> (H3/T3). The frame changes at every hop, but the <strong>IP packet inside stays the same</strong>.</div>
      <div class="ex-ar">جهاز بيبعت "Hello" للابتوب عن طريق راوترين R1 وR2. على الكابل من الجهاز للـ R1 الـ IP packet بيمشي جوه <strong>Ethernet frame</strong> (H1/T1). ومن R2 للابتوب بيتغلّف في <strong>wireless frame</strong> (H3/T3). الفريم بيتغيّر في كل hop، لكن <strong>الـ IP packet اللي جواه بيفضل زي ما هو</strong>.</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">10 · Error Detection (Parity &amp; Checksum)</span><span class="btitle-sep">|</span><span class="btitle-ar">اكتشاف الأخطاء (Parity و Checksum)</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p>Noise (like electromagnetic interference) can flip bits during transmission, so the Data Link layer adds extra information to detect errors.</p>
        <p><strong>1 · Parity checking:</strong> count the 1's in the bit stream. If the number of 1's is <strong>even</strong> → parity bit = <strong>0</strong>. If it is <strong>odd</strong> → parity bit = <strong>1</strong>. The receiver recomputes the parity and compares it with the received one — if they match, the frame is accepted.</p>
        <p><strong>2 · Checksum:</strong> the sender adds the data frame to its <strong>1's complement</strong> → the sum is all 1's → taking the 1's complement of that sum gives <strong>all 0's</strong> → the receiver <strong>accepts the frame</strong>. Any other result means an error.</p>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p>التشويش (زي التداخل الكهرومغناطيسي) ممكن يقلب bits وقت الإرسال، فطبقة Data Link بتضيف معلومات زيادة عشان تكتشف الأخطاء.</p>
        <p><strong>1 · Parity checking:</strong> بنعدّ عدد الـ 1's في سلسلة الـ bits. لو العدد <strong>زوجي</strong> ← parity bit = <strong>0</strong>. ولو <strong>فردي</strong> ← parity bit = <strong>1</strong>. المستقبِل بيحسب الـ parity تاني ويقارنه باللي وصله — لو اتطابقوا الفريم بيتقبل.</p>
        <p><strong>2 · Checksum:</strong> المرسِل بيجمع الـ data frame مع الـ <strong>1's complement</strong> بتاعه ← الناتج كله 1's ← ناخد الـ 1's complement للناتج ده فيطلع <strong>كله 0's</strong> ← المستقبِل <strong>بيقبل الفريم</strong>. أي ناتج غير كده معناه فيه خطأ.</p>
      </div>
    </div>
    <div class="highlight-row">
      <div class="hl-en">Checksum success test: Sum = all 1's → complement = all 0's → accept the frame.</div>
      <div class="hl-ar">اختبار نجاح الـ Checksum: المجموع = كله 1's ← الـ complement = كله 0's ← اقبل الفريم.</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en"><strong>Parity:</strong> the stream 1011000 has three 1's (odd) → parity bit = 1. <strong>Checksum:</strong> data 0100111001 01 + its complement 1011000110 10 = 111111111111 → complement = 000000000000 → receiver accepts.</div>
      <div class="ex-ar"><strong>Parity:</strong> السلسلة 1011000 فيها تلات 1's (فردي) ← parity bit = 1. <strong>Checksum:</strong> الداتا 010011100101 + الـ complement بتاعها 101100011010 = 111111111111 ← الـ complement = 000000000000 ← المستقبِل بيقبل.</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">11 · Layer 1 — Physical</span><span class="btitle-sep">|</span><span class="btitle-ar">الطبقة الفيزيائية</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p>The Physical layer is responsible for all the <strong>physical properties of the network</strong>:</p>
        <ol>
          <li><strong>Cable length</strong></li>
          <li><strong>Cable type</strong></li>
          <li><strong>Bit rate</strong></li>
          <li><strong>Voltage levels</strong></li>
          <li><strong>Hardware interface types</strong></li>
        </ol>
        <p>It turns the frame's <strong>bits</strong> into <strong>signals</strong> on the media: electricity on copper cables, light on fiber, radio waves through the air (wireless).</p>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p>الطبقة الفيزيائية مسؤولة عن كل <strong>الخصائص الفيزيائية للشبكة</strong>:</p>
        <ol>
          <li><strong>طول الكابل</strong></li>
          <li><strong>نوع الكابل</strong></li>
          <li><strong>معدل الـ bits (Bit rate)</strong></li>
          <li><strong>مستويات الجهد (Voltage levels)</strong></li>
          <li><strong>أنواع واجهات الهاردوير</strong></li>
        </ol>
        <p>بتحوّل <strong>bits</strong> الفريم لـ<strong>إشارات (signals)</strong> على الوسيط: كهربا على كابلات النحاس، ضوء على الألياف، وموجات راديو في الهواء (wireless).</p>
      </div>
    </div>
    <div class="highlight-row">
      <div class="hl-en">Layer 1 doesn't understand addresses or data meaning — it only moves raw bits as signals.</div>
      <div class="hl-ar">طبقة 1 مابتفهمش عناوين ولا معنى البيانات — هي بتنقل الـ bits الخام كإشارات بس.</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en">The bits 01001110 are sent as voltage pulses over an Ethernet cable, as light pulses over fiber optics, or as radio waves over Wi-Fi — same bits, different media.</div>
      <div class="ex-ar">الـ bits 01001110 بتتبعت كنبضات جهد على كابل Ethernet، أو كنبضات ضوء على الألياف الضوئية، أو كموجات راديو على الـ Wi-Fi — نفس الـ bits ووسائط مختلفة.</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">12 · TCP/IP Model vs OSI</span><span class="btitle-sep">|</span><span class="btitle-ar">نموذج TCP/IP ومقارنته بـ OSI</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p>The <strong>TCP/IP model</strong> has only <strong>4 layers</strong>, which map to OSI like this:</p>
        <ul>
          <li><strong>Application</strong> = OSI Application + Presentation + Session (7, 6, 5)</li>
          <li><strong>Transport</strong> = OSI Transport (4)</li>
          <li><strong>Internet</strong> = OSI Network (3)</li>
          <li><strong>Network Access</strong> = OSI Data Link + Physical (2, 1)</li>
        </ul>
        <p>The <strong>key parallels</strong> are in the <strong>Transport</strong> and <strong>Network (Internet)</strong> layers.</p>
        <p><strong>Same-layer interaction:</strong> the Application layer gives <strong>process-to-process</strong> communication; the Transport layer gives <strong>host-to-host</strong> communication (its TCP header carries the acknowledge number, sequence number and port number); the Internet layer adds the IP header. Routers in the middle only go up to the <strong>Internet layer</strong>: they decapsulate the frame, read the IP header, then encapsulate again for the next link.</p>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p>نموذج <strong>TCP/IP</strong> فيه <strong>4 طبقات بس</strong>، وبيقابلوا OSI كده:</p>
        <ul>
          <li><strong>Application</strong> = Application + Presentation + Session بتوع OSI (7 و6 و5)</li>
          <li><strong>Transport</strong> = طبقة Transport في OSI (4)</li>
          <li><strong>Internet</strong> = طبقة Network في OSI (3)</li>
          <li><strong>Network Access</strong> = Data Link + Physical في OSI (2 و1)</li>
        </ul>
        <p><strong>أهم تشابه</strong> بين النموذجين في طبقتي <strong>Transport</strong> و<strong>Network (Internet)</strong>.</p>
        <p><strong>التفاعل بين نفس الطبقات:</strong> طبقة Application بتوفّر اتصال <strong>process-to-process</strong>؛ وطبقة Transport بتوفّر اتصال <strong>host-to-host</strong> (والـ TCP header فيه رقم الإقرار ورقم التسلسل ورقم البورت)؛ وطبقة Internet بتضيف الـ IP header. الراوترات في النص بتطلع لحد <strong>طبقة Internet</strong> بس: بتفك الفريم، تقرا الـ IP header، وبعدين تغلّف تاني للوصلة اللي بعدها.</p>
      </div>
    </div>
    <div class="highlight-row">
      <div class="hl-en">TCP/IP merges OSI's top 3 layers into one and bottom 2 layers into one: 7 layers → 4 layers.</div>
      <div class="hl-ar">TCP/IP بيدمج أول 3 طبقات من فوق في طبقة واحدة، وآخر طبقتين من تحت في طبقة واحدة: 7 طبقات ← 4 طبقات.</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en">Samir sends a video to a friend over Telegram: the app data gets a <strong>TCP header</strong>, then an <strong>IP header</strong>, then an <strong>Ethernet header</strong> (a frame) and leaves as signals. The first router strips the Ethernet header, reads the IP, and sends it over a <strong>fiber</strong> link to the second router, which re-wraps it for the friend's LAN. At the friend's side every header is removed in reverse order until the video plays.</div>
      <div class="ex-ar">سمير بيبعت فيديو لصاحبه على تليجرام: داتا التطبيق بياخد <strong>TCP header</strong>، وبعدين <strong>IP header</strong>، وبعدين <strong>Ethernet header</strong> (فريم) ويخرج كإشارات. أول راوتر بيشيل الـ Ethernet header ويقرا الـ IP ويبعته على وصلة <strong>fiber</strong> للراوتر التاني، اللي بيغلّفه تاني لشبكة صاحبه. وعند صاحبه كل الهيدرز بتتشال بالعكس لحد ما الفيديو يشتغل.</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">13 · TCP/IP Layers &amp; Key Protocols</span><span class="btitle-sep">|</span><span class="btitle-ar">طبقات TCP/IP والبروتوكولات الأساسية</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p><strong>Application layer:</strong> File transfer (TFTP, FTP, NFS), E-mail (SMTP), Remote login (Telnet, rlogin), Network management (SNMP), Name management (DNS).</p>
        <p><strong>Transport layer:</strong> TCP — connection-oriented, reliable service; UDP — connectionless, unreliable service.</p>
        <p><strong>Internet layer:</strong> IP and routing protocols, ICMP, ARP, RARP.</p>
        <p><strong>Network Access layer:</strong> L2 LAN technologies — Ethernet, Token Ring, FDDI. L2 WAN technologies — Point-to-Point (HDLC, PPP), Frame Relay, X.25, ATM.</p>
        <p><strong>Key protocols at a glance:</strong></p>
        <ul>
          <li><strong>IP</strong> — connectionless, best-effort packet delivery.</li>
          <li><strong>TCP</strong> — reliable, connection-oriented delivery.</li>
          <li><strong>UDP</strong> — unreliable, connectionless delivery.</li>
          <li><strong>ARP</strong> — finds a physical address from an Internet (IP) address.</li>
          <li><strong>RARP</strong> — finds an Internet (IP) address from a physical address.</li>
          <li><strong>ICMP</strong> — query and error-reporting messages.</li>
          <li><strong>SCTP</strong> — supports newer applications such as VoIP.</li>
        </ul>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p><strong>طبقة Application:</strong> نقل الملفات (TFTP وFTP وNFS)، الإيميل (SMTP)، الدخول عن بعد (Telnet وrlogin)، إدارة الشبكة (SNMP)، إدارة الأسماء (DNS).</p>
        <p><strong>طبقة Transport:</strong> TCP — خدمة connection-oriented وموثوقة؛ UDP — خدمة connectionless وغير موثوقة.</p>
        <p><strong>طبقة Internet:</strong> بروتوكول IP وبروتوكولات التوجيه، وICMP وARP وRARP.</p>
        <p><strong>طبقة Network Access:</strong> تقنيات L2 للـ LAN — Ethernet وToken Ring وFDDI. وتقنيات L2 للـ WAN — Point-to-Point (HDLC وPPP) وFrame Relay وX.25 وATM.</p>
        <p><strong>البروتوكولات الأساسية بسرعة:</strong></p>
        <ul>
          <li><strong>IP</strong> — توصيل باكتات من غير اتصال مسبق وعلى قد المستطاع (best-effort).</li>
          <li><strong>TCP</strong> — توصيل موثوق بيعتمد على اتصال (connection-oriented).</li>
          <li><strong>UDP</strong> — توصيل غير موثوق ومن غير اتصال.</li>
          <li><strong>ARP</strong> — بيجيب العنوان الفيزيائي (MAC) من عنوان الـ IP.</li>
          <li><strong>RARP</strong> — بيجيب عنوان الـ IP من العنوان الفيزيائي.</li>
          <li><strong>ICMP</strong> — رسايل استعلام وتبليغ عن الأخطاء.</li>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">14 · Addressing &amp; Naming Schemes</span><span class="btitle-sep">|</span><span class="btitle-ar">أنظمة العنونة والتسمية</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p>Labels in the encapsulation headers manage communication. What each layer adds:</p>

          <li><strong>Data Link</strong> — destination and source <strong>physical addresses</strong> (MAC).</li>
          <li><strong>Network</strong> — destination and source <strong>logical network addresses</strong> (IP).</li>
          <li><strong>Transport</strong> — destination and source <strong>process numbers (ports)</strong>.</li>
          <li><strong>Upper layers</strong> — encoded application data.</li>
        </ul>
        <p>So TCP/IP uses <strong>4 kinds of addresses</strong>: <strong>physical, logical, port, and specific</strong> (user-friendly addresses such as an e-mail address or a URL).</p>
        <p><strong>On the way:</strong> the <strong>physical addresses change at every hop</strong> (each LAN has its own), but the <strong>logical (IP) addresses stay the same</strong> from sender to receiver, and the <strong>port numbers</strong> identify which process on each host the data belongs to.</p>

        </ul>
        <p>يعني TCP/IP بيستخدم <strong>4 أنواع عناوين</strong>: <strong>physical وlogical وport وspecific</strong> (عناوين سهلة للمستخدم زي عنوان الإيميل أو الـ URL).</p>

      </div>
    </div>
    <div class="highlight-row">

    </div>

    <div class="summary-content">
      <p>🧱 OSI فيه 7 طبقات: Application, Presentation, Session, Transport, Network, Data Link, Physical — الفايدة: معيار موحّد، توافق بين الأجهزة، وتغيير طبقة مايأثرش على غيرها.</p>
      <p>📦 التغليف (Encapsulation): كل طبقة بتضيف هيدر (والـ Data Link بتضيف تريلر كمان)، ووحدات البيانات: Data ← Segments ← Packets ← Frames ← Bits، والمستقبِل بيعمل Decapsulation.</p>

      <p>🌐 TCP/IP فيه 4 طبقات (Application, Transport, Internet, Network Access)، وأهم تشابه مع OSI في Transport وNetwork. وبروتوكولاته الأساسية: IP, TCP, UDP, ARP, RARP, ICMP, SCTP.</p>
      <p>🏷️ 4 أنواع عناوين: Physical (بتتغيّر كل hop) وLogical IP (ثابتة end-to-end) وPort (بتحدد التطبيق) وSpecific (إيميل / URL).</p>

        <p>Data mining sits at the intersection of: <strong>machine learning, statistics, databases, pattern recognition, visualization</strong>, and high-performance computing.</p>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p><strong>Data Mining</strong> يعني استخراج <strong>أنماط ومعرفة مفيدة</strong> من كميات ضخمة من البيانات — أنماط تكون <strong>مش واضحة، مخفية، مش معروفة قبل كده، وممكن تفيدنا</strong>.</p>
        <p>ليها أسماء تانية كتير زي <strong>Knowledge Discovery in Databases (KDD)</strong>، استخراج المعرفة، تحليل البيانات، و Business Intelligence.</p>
        <p>الـ Data Mining تقاطع بين <strong>Machine Learning</strong> و<strong>Statistics</strong> و<strong>Databases</strong> و<strong>Pattern Recognition</strong> والـ <strong>Visualization</strong> والـ High-Performance Computing.</p>
      </div>
    </div>
    <div class="highlight-row">
      <div class="hl-en">Data mining is not just querying data — it discovers hidden, valuable patterns you never asked about directly.</div>
      <div class="hl-ar">الـ Data Mining مش مجرد استعلام عن البيانات — هي اكتشاف أنماط مخفية وقيّمة إنت أصلاً ما سألتش عنها.</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en">A supermarket asks "Which products are bought together?" Data mining finds the rule {Diaper → Beer} with support 0.5% and confidence 75% — knowledge that was hiding in millions of receipts.</div>
      <div class="ex-ar">سوبرماركت بيسأل: "أيه المنتجات اللي بتتشتري مع بعض؟" الـ Data Mining بتطلع القاعدة {Diaper → Beer} بـ support 0.5% و confidence 75% — معرفة كانت مخبية في ملايين الإيصالات.</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">3 · The KDD Process</span><span class="btitle-sep">|</span><span class="btitle-ar">مراحل الـ KDD Process</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p><strong>Data mining is one step inside the larger KDD process</strong>. The pipeline:</p>
        <ul>
          <li><strong>Pre-processing:</strong> data integration, normalization, feature selection, dimension reduction, cleaning.</li>
          <li><strong>Data mining:</strong> pattern discovery — association, classification, clustering, outlier analysis.</li>
          <li><strong>Post-processing:</strong> pattern evaluation, selection, interpretation, and visualization.</li>
        </ul>
        <p>Garbage in, garbage out — quality of mining depends heavily on pre-processing.</p>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p>الـ <strong>Data Mining</strong> خطوة واحدة بس جوه عملية <strong>KDD</strong> أكبر منها. المراحل:</p>
        <ul>
          <li><strong>Pre-processing:</strong> دمج البيانات، الـ normalization، اختيار الـ features، تقليل الأبعاد، والتنظيف.</li>
          <li><strong>Data mining:</strong> اكتشاف الأنماط — association، classification، clustering، و outlier analysis.</li>
          <li><strong>Post-processing:</strong> تقييم الأنماط، اختيار المفيد منها، تفسيره، وعرضه بصريًا.</li>
        </ul>
        <p>قاعدة ذهبية: لو دخلت بيانات وحش هيطلع نتائج وحش — جودة الـ mining بتعتمد بشكل كبير على مرحلة الـ pre-processing.</p>
      </div>
    </div>
    <div class="highlight-row">
      <div class="hl-en">KDD is a pipeline: prepare first, mine second, evaluate last — mining is only the middle step.</div>
      <div class="hl-ar">الـ KDD خط إنتاج: نجهز الأول، نستخرج بعدين، نقيّم في الآخر — الـ mining مجرد خطوة في النص.</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en">A telecom company collects call records from 3 different systems. First they integrate and clean the data (pre-processing), then mine rules connecting alarms (mining), then keep only rules engineers confirm as useful (post-processing).</div>
      <div class="ex-ar">شركة اتصالات بتجمع سجلات المكالمات من 3 أنظمة مختلفة. الأول بتدمج البيانات وتنظفها (pre-processing)، بعدين بتستخرج قواعد بتوضح علاقة الأعطال ببعض (mining)، وأخيرًا بتحتفظ بس بالقواعد اللي المهندسين أكدوا إنها مفيدة (post-processing).</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">4 · Classification</span><span class="btitle-sep">|</span><span class="btitle-ar">التصنيف (Classification)</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p><strong>Classification</strong> is a <strong>supervised learning</strong> task: build a <strong>model</strong> from labeled training data, then use it to predict the class label of new, unknown records.</p>
        <ul>
          <li><strong>Input:</strong> training set with known labels (e.g., Credit Worthy: Yes/No).</li>
          <li><strong>Output:</strong> a classifier (e.g., a decision tree).</li>
          <li><strong>Methods:</strong> decision trees, naïve Bayes, SVM, neural networks, logistic regression.</li>
        </ul>
        <p>Data is split into a <strong>training set</strong> (to learn) and a <strong>test set</strong> (to evaluate).</p>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p>الـ <strong>Classification</strong> مهمة <strong>supervised learning</strong>: بنبني <strong>موديل</strong> من بيانات تدريب ليها labels معروفة، وبعدين نستخدمه للتنبؤ بـ class بتاع سجلات جديدة مجهولة.</p>
        <ul>
          <li><strong>المدخل:</strong> training set فيه labels (مثلاً Credit Worthy: Yes/No).</li>
          <li><strong>المخرج:</strong> classifier (مثلاً decision tree).</li>
          <li><strong>الطرق:</strong> decision trees، naïve Bayes، SVM، neural networks، logistic regression.</li>
        </ul>
        <p>بنقسم البيانات لـ <strong>training set</strong> (الموديل يتعلم منها) و<strong>test set</strong> (نقيّم بيها أداء الموديل).</p>
      </div>
    </div>
    <div class="highlight-row">
      <div class="hl-en">Classification learns from examples with known answers to assign the right answer to new examples.</div>
      <div class="hl-ar">الـ Classification بتتعلم من أمثلة الإجابة بتاعتها معروفة، عشان تدي الإجابة الصح للأمثلة الجديدة.</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en">A bank trains a classifier on past customers (Employed? Education? Years at address? → Credit Worthy). A decision tree learns: if unemployed and below graduate level → not credit worthy. This model then predicts new loan applicants.</div>
      <div class="ex-ar">بنك بيدرب classifier على عملاء قدام (موظف؟ تعليمه إيه؟ قد إيه ساكن في نفس العنوان؟ → مستحق للائتمان). الـ decision tree بتتعلم: لو مش موظف ومستواه أقل من graduate → مش مستحق. وبعدين الموديل ده بيتنبأ بطلبات القروض الجديدة.</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">5 · Regression</span><span class="btitle-sep">|</span><span class="btitle-ar">الانحدار (Regression)</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p><strong>Regression</strong> predicts the value of a <strong>continuous variable</strong> based on other variables, assuming a linear or nonlinear dependency model.</p>
        <ul>
          <li>Classification predicts a <strong>category</strong>; regression predicts a <strong>number</strong>.</li>
          <li>Extensively studied in statistics and neural networks.</li>
          <li>Examples: sales from advertising spend, wind velocity from weather data, stock index forecasting.</li>
        </ul>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p>الـ <strong>Regression</strong> بتتنبأ بقيمة <strong>رقم continuous</strong> بناءً على متغيرات تانية، بافتراض علاقة linear أو nonlinear بينهم.</p>
        <ul>
          <li>الـ Classification بتتنبأ بـ<strong>فئة</strong>؛ الـ Regression بتتنبأ بـ<strong>رقم</strong>.</li>
          <li>مجال قديم ومتدرس جدًا في الـ statistics والـ neural networks.</li>
          <li>أمثلة: توقع المبيعات من تكلفة الإعلانات، سرعة الرياح من حالة الطقس، وتوقع مؤشرات البورصة.</li>
        </ul>
      </div>
    </div>
    <div class="highlight-row">
      <div class="hl-en">When the answer is a number, not a label, the task is regression.</div>
      <div class="hl-ar">لما الإجابة تكون رقم مش فئة، المهمة دي اسمها Regression.</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en">A company spends 10K on ads and wants to know expected sales. A regression model learns: sales ≈ 3 × advertising + 20 from historical data, and predicts 50K in sales for 10K spent.</div>
      <div class="ex-ar">شركة بتصرف 10K على الإعلانات وعايزة تعرف المبيعات المتوقعة. موديل regression بتعلم من البيانات القديمة: المبيعات ≈ 3 × الإعلانات + 20، فبيتنبأ بمبيعات 50K لما تصرف 10K.</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">6 · Cluster Analysis</span><span class="btitle-sep">|</span><span class="btitle-ar">تحليل التجميع (Clustering)</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p><strong>Clustering</strong> is <strong>unsupervised learning</strong>: class labels are unknown, and the algorithm groups objects so objects in the same cluster are similar and different from other clusters.</p>
        <ul>
          <li>Principle: <strong>maximize intra-cluster similarity</strong> and <strong>minimize inter-cluster similarity</strong>.</li>
          <li>Used for: customer profiling, document grouping, genes with similar function, summarizing large datasets.</li>
          <li>Classic algorithm: <strong>K-means</strong>.</li>
        </ul>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p>الـ <strong>Clustering</strong> نوع من الـ <strong>unsupervised learning</strong>: الـ labels مش معروفة أصلًا، والخوارزمية بتجمع العناصر المتشابهة في clusters، والعناصر في clusters مختلفة تكون بعيدة عن بعض.</p>
        <ul>
          <li>المبدأ: <strong>نزود التشابه جوه الـ cluster</strong> و<strong>نقلل التشابه بين الـ clusters المختلفة</strong>.</li>
          <li>بتتستخدم في: customer profiling، تجميع مستندات، جينات وظيفتها واحدة، وتصغير الداتاسيتس الكبيرة.</li>
          <li>أشهر خوارزمية: <strong>K-means</strong>.</li>
        </ul>
      </div>
    </div>
    <div class="highlight-row">
      <div class="hl-en">Clustering finds the natural groups in data when nobody tells you what the groups are.</div>
      <div class="hl-ar">الـ Clustering بتلاقي المجموعات الطبيعية في البيانات وأنت مش عارف أصلاً إيه المجموعات دي.</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en">An e-commerce company has no predefined customer categories. Clustering groups customers by purchase behavior into 4 segments — "big spenders", "discount hunters", "occasional buyers" — and marketing targets each segment differently.</div>
      <div class="ex-ar">شركة تجارة إلكترونية ماعندهاش فئات للعملاء. الـ Clustering بتقسمهم حسب سلوك الشراء لـ 4 شرائح — "اللي بيصرفوا كتير"، "اللي بيدوروا على الخصومات"، "اللي بيشتروا أحيانًا" — وبعدين التسويق بيستهدف كل شريحة بطريقة مختلفة.</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">7 · Association Rule Discovery</span><span class="btitle-sep">|</span><span class="btitle-ar">اكتشاف قواعد الارتباط</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p><strong>Association rule mining</strong> finds dependency rules that predict one item based on other items in a transaction.</p>
        <ul>
          <li><strong>Frequent itemsets:</strong> sets of items appearing together often.</li>
          <li><strong>Rule format:</strong> {Diaper → Beer} with <strong>support</strong> (how often) and <strong>confidence</strong> (how reliable).</li>
          <li><strong>Association ≠ causality:</strong> items bought together are not necessarily causes of each other.</li>
          <li>Applications: market-basket analysis, telecom alarm diagnosis, medical informatics.</li>
        </ul>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p>الـ <strong>Association rule mining</strong> بتلاقي قواعد بتتنبأ بحدوث منتج معين بناءً على وجود منتجات تانية في نفس المعاملة.</p>
        <ul>
          <li><strong>Frequent itemsets:</strong> مجموعات منتجات بتظهر مع بعض بشكل متكرر.</li>
          <li><strong>شكل القاعدة:</strong> {Diaper → Beer} مع الـ<strong>support</strong> (بتتكرر قد إيه) والـ<strong>confidence</strong> (مضمونة قد إيه).</li>
          <li><strong>مهم جدًا:</strong> الارتباط مش سببية — حاجتين بتتشتروا مع بعض مش معناه إن واحدة بتسبب التانية.</li>
          <li>التطبيقات: تحليل سلة المشتريات، تشخيص أعطال الاتصالات، المعلوماتية الطبية.</li>
        </ul>
      </div>
    </div>
    <div class="highlight-row">
      <div class="hl-en">Association rules reveal which items travel together — useful, but correlation does not mean causation.</div>
      <div class="hl-ar">قواعد الارتباط بتكشف أنهي حاجات بتتجمع مع بعض — مفيدة جدًا، بس الارتباط مش معناه سببية.</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en">From 5 transactions, mining discovers {Milk → Coke} and {Diaper, Milk → Beer}. The rule {Diaper, Milk → Beer} means: when a customer buys diapers AND milk, there is a high chance they also buy beer.</div>
      <div class="ex-ar">من 5 معاملات بس، بنكتشف {Milk → Coke} و{Diaper, Milk → Beer}. قاعدة {Diaper, Milk → Beer} معناها: لما العميل يشتري حفاضات وحليب، في احتمال كبير إنه يشتري بيرة كمان.</div>
    </div>
  </div>

  <div class="content-block">
    <div class="block-title-bar"><span class="btitle-en">8 · Challenges & Applications</span><span class="btitle-sep">|</span><span class="btitle-ar">التحديات والتطبيقات</span></div>
    <div class="bilingual-grid">
      <div class="col-en"><div class="col-label">ENGLISH</div>
        <p><strong>Key challenges:</strong></p>
        <ul>
          <li><strong>Scalability</strong> — algorithms must handle terabytes.</li>
          <li><strong>High dimensionality</strong> — thousands of attributes per record.</li>
          <li><strong>Heterogeneous and complex data</strong> — text, images, graphs, time series.</li>
          <li><strong>Data ownership and distribution</strong> — data spread across sites and organizations.</li>
          <li><strong>Non-traditional analysis</strong> — no explicit query, patterns are the output.</li>
        </ul>
        <p><strong>Applications:</strong> web page analysis & PageRank, recommender systems, targeted marketing, bioinformatics, medical analysis, software engineering.</p>
      </div>
      <div class="col-ar"><div class="col-label">العربية</div>
        <p><strong>التحديات الأساسية:</strong></p>
        <ul>
          <li><strong>Scalability</strong> — الخوارزميات لازم تستحمل terabytes من البيانات.</li>
          <li><strong>High dimensionality</strong> — آلاف الـ attributes في السجل الواحد.</li>
          <li><strong>Heterogeneous data</strong> — نصوص وصور وجرافات و time series مع بعض.</li>
          <li><strong>Data ownership</strong> — البيانات موزعة على أماكن ومنظمات مختلفة.</li>
          <li><strong>Non-traditional analysis</strong> — مفيش استعلام واضح، الناتج هو الأنماط نفسها.</li>
        </ul>
        <p><strong>التطبيقات:</strong> تحليل صفحات الويب و PageRank، أنظمة التوصية، التسويق المستهدف، الـ bioinformatics والتحليل الطبي، وهندسة البرمجيات.</p>
      </div>
    </div>
    <div class="highlight-row">
      <div class="hl-en">The bigger, more diverse, and more distributed the data, the harder mining becomes — and the more valuable its results.</div>
      <div class="hl-ar">كل ما البيانات تكبر وتتنوع وتتوزع أكتر، الـ mining تبقى أصعب — ونتائجها تبقى أغلى.</div>
    </div>
    <div class="example-box">
      <span class="ex-label">EXAMPLE — مثال</span>
      <div class="ex-en">A hospital network mines patient records across 10 branches (distribution challenge), each record includes scans, doctor notes, and lab results (heterogeneous data), for thousands of patients (scalability).</div>
      <div class="ex-ar">شبكة مستشفيات عايزة تعمل mining لسجلات المرضى في 10 فروع (تحدي التوزيع)، وكل سجل فيه أشعة وملاحظات دكاترة وتحاليل (تحدي تنوع البيانات)، لآلاف المرضى (تحدي الـ scalability).</div>
    </div>
  </div>

  <div class="summary-block">
    <h3>ملخص المحاضرة 01 — مقدمة في الـ Data Mining</h3>
    <div class="summary-content">
      <p>📌 <strong>Data Mining</strong> يعني استخراج أنماط ومعرفة <strong>مخفية ومفيدة</strong> من كميات ضخمة من البيانات — مش مجرد استعلام عادي.</p>
      <p>📊 إحنا <strong>غرقانين في الداتا ومحتاجين المعرفة</strong>: البيانات بتتولد من البيزنس والعلوم والسوشيال بشكل أكبر من قدرتنا على قراءتها يدويًا.</p>
      <p>🔧 الـ Data Mining خطوة جوه <strong>KDD</strong>: <strong>Pre-processing</strong> ← <strong>Data Mining</strong> ← <strong>Post-processing</strong>. لو دخلت بيانات وحش هيطلع نتائج وحش.</p>
      <p>🏷️ <strong>Classification</strong>: supervised — بتتنبأ بـ<strong>فئة</strong> (مثلاً Credit Worthy: Yes/No) باستخدام موديل متدرب على labeled data.</p>
      <p>🔢 <strong>Regression</strong>: بتتنبأ بـ<strong>رقم continuous</strong> (مثلاً المبيعات)، مش فئة.</p>
      <p>🧩 <strong>Clustering</strong>: unsupervised — بتكتشف <strong>المجموعات الطبيعية</strong> من غير ما حد يقولها المجموعات إيه. مبدأها: زود التشابه جوه الـ cluster وقلل التشابه بين الـ clusters.</p>
      <p>🛒 <strong>Association Rules</strong>: {Diaper → Beer} بالـ<strong>support</strong> والـ<strong>confidence</strong> — الارتباط <strong>مش سببية</strong>.</p>
      <p>⚠️ أهم التحديات: <strong>Scalability</strong>، <strong>High dimensionality</strong>، تنوع البيانات، وتوزيع ملكيتها.</p>
      <p>🚀 تطبيقات: market-basket analysis، fraud detection، recommender systems، الـ bioinformatics، وتحليل الويب.</p>
    </div>
  </div>

  {q:"Clustering is considered ______ learning because class labels are unknown.",opts:["Supervised","Unsupervised","Reinforcement","Semi-supervised"],a:1,ex:"الـ Clustering شغال من غير labels خالص — الخوارزمية هي اللي بتقرر إزاي تقسم البيانات لمجموعات متشابهة، وده تعريف الـ unsupervised learning. الـ supervised (زي Classification) بيحتاج labels جاهزة في الـ training data."},

  {q:"Which of the following is NOT one of the motivating challenges of data mining?",opts:["Scalability","High dimensionality","Data ownership and distribution","Lack of data in modern systems"],a:3,ex:"المشكلة بالعكس تمامًا — عندنا فيضان من البيانات مش نقص. التحديات الحقيقية: Scalability، High dimensionality، Heterogeneous data، Data ownership. 'Lack of data' عكس الواقع وعكس سبب وجود الـ data mining أصلًا."},

  {q:"In the lecture's Walmart example, what does data mining discover about customers who buy diapers?",opts:["They often buy beer too","They rarely buy anything else","They always pay by credit card","They shop only on weekends"],a:0,ex:"المحاضرة بتقول إن وول مارت بتسجل ملايين المعاملات يوميًا، والـ Data Mining اكتشفت إن اللي بيشتري حفاضات غالبًا بيشتري بيرة كمان — نمط مستحيل إنسان يلاحظه لو قرا الإيصالات واحد واحد."},
  {q:"The lecture says we are 'drowning in data but starving for knowledge'. What solution does it propose?",opts:["Storing less data","Hiring more analysts to read records","Automated analysis of massive datasets (data mining)","Collecting data more slowly"],a:2,ex:"الداتا بتزيد أسرع من قدرتنا على قراءتها، فالحل هو تحليل أوتوماتيكي للداتا الضخمة وده بالظبط اللي بتعمله الـ Data Mining. تخزين أقل أو تعيين محللين أكتر مش هيحل المشكلة."},

  {q:"Data mining sits at the intersection of which fields?",opts:["Machine learning, statistics, databases, and pattern recognition","Only databases and SQL","Only web design and graphics","Networking and hardware design"],a:0,ex:"المحاضرة بتقول إن الـ Data Mining تقاطع بين Machine Learning و Statistics و Databases و Pattern Recognition و Visualization و High-Performance Computing — مش مجال واحد بس."},
  {q:"Which of the following belongs to the pre-processing step of KDD?",opts:["Pattern evaluation","Clustering objects into groups","Interpreting the discovered patterns","Data integration and cleaning"],a:3,ex:"الـ pre-processing بيشمل دمج البيانات، الـ normalization، اختيار الـ features، تقليل الأبعاد، والتنظيف. تقييم الأنماط وتفسيرها من الـ post-processing، والـ clustering من خطوة الـ mining نفسها."},
  {q:"Which activity belongs to the post-processing step of KDD?",opts:["Feature selection","Dimension reduction","Pattern evaluation, interpretation and visualization","Data normalization"],a:2,ex:"الـ post-processing بييجي بعد الـ mining ويشمل تقييم الأنماط واختيار المفيد منها وتفسيره وعرضه بصريًا. الباقي (feature selection و dimension reduction و normalization) كلها pre-processing."},
  {q:"'Garbage in, garbage out' in the KDD context means:",opts:["The quality of mining results depends heavily on pre-processing","Mining automatically removes bad data by itself","Post-processing is more important than pre-processing","Larger data always gives better results"],a:0,ex:"لو دخلت بيانات وحشة هتطلع نتائج وحشة، فجودة الـ mining بتعتمد بشكل كبير على مرحلة الـ pre-processing. الـ mining مش بتنضف الداتا لوحدها، وكبر حجم الداتا مش بيضمن جودتها."},
  {q:"In the telecom example, engineers keeping only the rules they confirm as useful is which KDD step?",opts:["Pre-processing","Data mining","Post-processing","Data integration"],a:2,ex:"الشركة الأول دمجت ونضفت سجلات المكالمات (pre-processing)، بعدين استخرجت قواعد الأعطال (mining)، وأخيرًا احتفظت بس بالقواعد اللي المهندسين أكدوا إنها مفيدة — وده تقييم واختيار للأنماط يعني post-processing."},
  {q:"Which of the following is a classification method mentioned in the lecture?",opts:["K-means","PageRank","Frequent itemsets","Naïve Bayes"],a:3,ex:"طرق الـ Classification في المحاضرة: decision trees و naïve Bayes و SVM و neural networks و logistic regression. الـ K-means خوارزمية clustering، والـ PageRank تطبيق لتحليل الويب، والـ frequent itemsets تخص الـ association rules."},
  {q:"In the bank example, what is the output of the classification process?",opts:["A classifier such as a decision tree","A list of frequent itemsets","A set of clusters","A numerical sales forecast"],a:0,ex:"المدخل هو الـ training set اللي فيه labels معروفة (Credit Worthy: Yes/No)، والمخرج هو classifier زي الـ decision tree بنستخدمه بعد كده للتنبؤ بطلبات القروض الجديدة."},
  {q:"Using the lecture's regression model sales ≈ 3 × advertising + 20, what sales are predicted for 10K of advertising?",opts:["30K","23K","50K","60K"],a:2,ex:"بنعوّض في المعادلة: 3 × 10 + 20 = 50، يعني المبيعات المتوقعة 50K. لاحظ إن الناتج رقم continuous مش فئة، وده اللي بيخلي المهمة Regression."},
  {q:"Which classic algorithm is mentioned in the lecture for cluster analysis?",opts:["K-means","Naïve Bayes","PageRank","SVM"],a:0,ex:"أشهر خوارزمية Clustering اتذكرت في المحاضرة هي K-means. الـ Naïve Bayes و SVM من طرق الـ Classification، والـ PageRank مرتبط بتحليل صفحات الويب."},
  {q:"Which of the following is a use of clustering listed in the lecture?",opts:["Finding rules like {Diaper → Beer}","Predicting a numeric sales value","Splitting data into training and test sets","Customer profiling and document grouping"],a:3,ex:"الـ Clustering بتتستخدم في customer profiling وتجميع المستندات والجينات المتشابهة في الوظيفة وتلخيص الداتاسيتس الكبيرة. القواعد من نوع {Diaper → Beer} بتاعة الـ association، والتنبؤ بالرقم بتاع الـ regression."},
  {q:"What does the rule {Diaper, Milk → Beer} mean?",opts:["Beer buyers always buy diapers and milk","Diapers and milk cause people to buy beer","When a customer buys diapers AND milk, there is a high chance they also buy beer","Milk is a substitute for beer"],a:2,ex:"القاعدة معناها إن لما العميل يشتري حفاضات وحليب مع بعض، في احتمال كبير إنه يشتري بيرة كمان. مش معناها إن الحفاضات والحليب بيسببوا شراء البيرة (B)، ولا إن كل مشتري بيرة بيشتريهم (A)، لأن الارتباط مش سببية."},
  {q:"A hospital network mining patient records spread across 10 branches illustrates which challenge?",opts:["Scalability","Heterogeneous data","High dimensionality","Data ownership and distribution"],a:3,ex:"البيانات موزعة على 10 فروع مختلفة، وده تحدي الـ data ownership and distribution. أما اختلاف أنواع البيانات (أشعة وملاحظات وتحاليل) فده heterogeneous data، وكبر عدد المرضى ده scalability."}

const DM_LEC02_HTML = `
<div class="lec-page" id="dm-lec02">
  <div class="page-header">
    <span class="page-lec-num">LECTURE 02</span>
    <div class="page-title-wrap"><h2>Data Preprocessing<span>معالجة البيانات قبل التنقيب</span></h2></div>
